<script>
/* KD-Group UI wiring fixes — navigation/DOM only. Business handlers,
   roles and permissions remain owned by the existing Scripts.html logic. */
(function () {
  function cleanupMobileCloneIds() {
    var content = document.getElementById('mobile-nav-drawer-content');
    if (!content) return;
    content.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
  }

  function wrapMobile(fnName) {
    var original = window[fnName];
    if (typeof original !== 'function' || original.__kdWrapped) return;
    var wrapped = function () {
      var out = original.apply(this, arguments);
      cleanupMobileCloneIds();
      return out;
    };
    wrapped.__kdWrapped = true;
    window[fnName] = wrapped;
  }

  function install() {
    // The original mobile builder is preserved; we only remove duplicate IDs
    // from cloned buttons so getElementById/query selectors do not hit the
    // hidden desktop copy instead of the visible mobile copy.
    wrapMobile('mobileNavGroup');
    wrapMobile('mobileNavMore');
    cleanupMobileCloneIds();
  }

  install();
  document.addEventListener('DOMContentLoaded', install, { once: true });

  // New page content can recreate the mobile drawer. Observe nodes only;
  // observing style/hidden would create a feedback loop.
  var observer = new MutationObserver(function () {
    cleanupMobileCloneIds();
  });
  observer.observe(document.documentElement, { subtree: true, childList: true });
})();
</script>
