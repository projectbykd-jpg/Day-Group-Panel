<script>
/* KD-Group UI stability/performance layer.
   Business handlers, API calls, roles and permissions remain owned by Scripts.html. */
(function () {
  function profileSnapshot() {
    try { return JSON.parse(localStorage.getItem('daygroup_profile') || '{}') || {}; } catch (e) { return {}; }
  }
  function role() { return String(profileSnapshot().role || '').trim().toUpperCase(); }
  function perms() {
    var p = profileSnapshot().permissions || {};
    return { telegram: p.telegram !== false, linktree: p.linktree !== false, panelz: p.panelz !== false };
  }
  function setVisible(el, yes) {
    if (!el) return;
    if (yes) { el.hidden = false; el.style.removeProperty('display'); }
    else { el.hidden = true; el.style.setProperty('display', 'none', 'important'); }
  }
  function applyFeatureAccess() {
    var r = role(), p = perms(), isBot = r === 'BOT', isAdmin = r === 'ADMIN', isOp = isAdmin || r === 'OPERATOR';
    document.querySelectorAll('[onclick*="copyTelegram"]').forEach(function (el) { setVisible(el, p.telegram && !isBot); });
    document.querySelectorAll('[onclick*="copyLinktree1"],[onclick*="copyLinktree2"]').forEach(function (el) { setVisible(el, p.linktree && !isBot); });
    document.querySelectorAll('[onclick*="copyPanelZ"],[onclick*="sendToPanelZ"],[onclick*="sendToPanelZCustom"]').forEach(function (el) { setVisible(el, p.panelz && !isBot); });
    document.querySelectorAll('.livechat-op-only').forEach(function (el) { setVisible(el, isOp); });
    var lc = document.querySelector('.nav-group[data-group="livechat"]');
    if (lc) setVisible(lc, isOp);
    if (isBot) {
      document.querySelectorAll('.nav-extra, .nav-solo, .nav-group:not([data-group="bot"])').forEach(function (el) { setVisible(el, false); });
      var bg = document.querySelector('.nav-group[data-group="bot"]');
      if (bg) setVisible(bg, true);
    }
  }

  function cleanupMobileCloneIds() {
    var content = document.getElementById('mobile-nav-drawer-content');
    if (!content) return;
    content.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
  }

  function normalizeNavOrder() {
    var nav = document.querySelector('#app-container .nav-groups');
    if (!nav) return;
    var order = {
      home: 10,
      automation: 20,
      lapor: 30,
      activity: 40,
      bot: 50,
      livechat: 60,
      admin: 70
    };
    var home = document.getElementById('nav-home');
    var automation = nav.querySelector('.nav-group[data-group="automation"]');
    var lapor = nav.querySelector('.nav-group[data-group="lapor"]');
    var activity = document.getElementById('nav-activity');
    var bot = nav.querySelector('.nav-group[data-group="bot"]');
    var livechat = nav.querySelector('.nav-group[data-group="livechat"]');
    var admin = document.getElementById('nav-admin');
    [[home,'home'],[automation,'automation'],[lapor,'lapor'],[activity,'activity'],[bot,'bot'],[livechat,'livechat'],[admin,'admin']].forEach(function (pair) {
      if (pair[0]) pair[0].style.order = String(order[pair[1]]);
    });
  }

  function wrapMobile(fnName) {
    var original = window[fnName];
    if (typeof original !== 'function' || original.__kdWrapped) return;
    var wrapped = function () {
      var out = original.apply(this, arguments);
      cleanupMobileCloneIds();
      return out;
    };
    wrapped.__kdWrapped = true;
    window[fnName] = wrapped;
  }

  /* Navigation used to do a server log write, realtime poll and page animation
     on every click. A menu click should be local/instant; the background poll
     already owns realtime synchronization. Real business/API logging is untouched. */
  function quietNavigation() {
    var original = window.switchPage;
    if (typeof original !== 'function' || original.__kdPerfWrapped) return;
    var wrapped = function (page) {
      var r = role();
      var botPages = ['bot-dashboard','bot-sources','bot-history','bot-fbdirect','bot-config'];
      var livePages = ['livechat-sessions','livechat-templates'];
      if (r === 'BOT' && botPages.indexOf(page) < 0) page = 'bot-dashboard';
      if (r !== 'BOT' && botPages.indexOf(page) >= 0) page = 'home';
      if (page === 'admin' && r !== 'ADMIN') page = r === 'BOT' ? 'bot-dashboard' : 'home';
      if (livePages.indexOf(page) >= 0 && r !== 'ADMIN' && r !== 'OPERATOR') page = 'home';

      var oldPoll = window.pumpLivePoll;
      var oldRun = window.google && window.google.script && window.google.script.run;
      var oldFx = null;
      var restoreRun = false;
      try {
        if (typeof oldPoll === 'function') window.pumpLivePoll = function () {};

        /* Suppress ONLY the navigation audit event "BUKA HALAMAN". */
        if (oldRun) {
          var wrapRunner = function (runner) {
            if (!runner || typeof runner !== 'object') return runner;
            return new Proxy(runner, {
              get: function (target, prop) {
                if (prop === 'logClientActivity') {
                  return function (token, action) {
                    if (String(action || '').toUpperCase() === 'BUKA HALAMAN') return undefined;
                    return target[prop].apply(target, arguments);
                  };
                }
                if (prop === 'withFailureHandler' || prop === 'withSuccessHandler' || prop === 'withUserObject') {
                  return function () { return wrapRunner(target[prop].apply(target, arguments)); };
                }
                return target[prop];
              }
            });
          };
          window.google.script.run = wrapRunner(oldRun);
          restoreRun = true;
        }

        /* Keep business behaviour but skip transition animation during navigation.
           The original FX preference is restored immediately afterwards. */
        try { oldFx = localStorage.getItem('dg_fx'); localStorage.setItem('dg_fx', 'off'); } catch (e) {}
        return original.call(this, page);
      } finally {
        if (oldFx !== null) { try { localStorage.setItem('dg_fx', oldFx); } catch (e) {} }
        if (typeof oldPoll === 'function') window.pumpLivePoll = oldPoll;
        if (restoreRun) window.google.script.run = oldRun;
        cleanupMobileCloneIds();
        normalizeNavOrder();
      }
    };
    wrapped.__kdPerfWrapped = true;
    window.switchPage = wrapped;
  }

  function install() {
    wrapMobile('mobileNavGroup');
    wrapMobile('mobileNavMore');
    quietNavigation();
    normalizeNavOrder();
    applyFeatureAccess();
    cleanupMobileCloneIds();
  }

  install();
  document.addEventListener('DOMContentLoaded', install, { once: true });
  var oldApply = window.applyProfileUI;
  if (typeof oldApply === 'function' && !oldApply.__kdAccessWrapped) {
    var ap = function () { var out = oldApply.apply(this, arguments); normalizeNavOrder(); applyFeatureAccess(); return out; };
    ap.__kdAccessWrapped = true;
    window.applyProfileUI = ap;
  }

  /* Intentionally no global MutationObserver: the previous observer scanned the
     DOM for every render/update and was a major source of CPU spikes and lag. */
})();
</script>
