    }
    let botFbTplLastImageUrl = '';
    let botFbTplHistoryCache = [];
    function botFbTplShowResult(title, imageUrl, caption){
      document.getElementById('botFbTplEmpty').style.display = 'none';
      document.getElementById('botFbTplResult').style.display = 'flex';
      document.getElementById('botFbTplTitle').textContent = title || '';
      document.getElementById('botFbTplCaption').value = caption || '';
      botFbTplLastImageUrl = imageUrl || '';
      const img = document.getElementById('botFbTplImg');
      const imgOpen = document.getElementById('botFbTplImgOpen');
      const noImg = document.getElementById('botFbTplNoImg');
      if (imageUrl) {
        img.style.display = ''; imgOpen.style.display = ''; noImg.style.display = 'none';
        img.src = '/img?url=' + encodeURIComponent(imageUrl);
        imgOpen.href = imageUrl;
      } else {
        img.style.display = 'none'; imgOpen.style.display = 'none'; noImg.style.display = '';
      }
    }
    function botFbTplReopen(id){
      const h = botFbTplHistoryCache.find(x => Number(x.id) === Number(id));
      if (!h) { toast('Data tidak ditemukan, coba refresh dulu'); return; }
      botFbTplShowResult(h.title, h.image_url, h.fb_template_caption || '(caption lama belum tersimpan, generate ulang ya)');
      document.getElementById('botFbTplResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast('Menampilkan template yang sudah pernah dibuat');
    }
    function botFbTemplateGenerate(){
      showActionPopup('LOADING', 'Menyiapkan Template', 'Mengambil artikel & membuat caption dengan AI...', 'fa-wand-magic-sparkles');
      google.script.run.withSuccessHandler(r=>{
        closeActionPopup();
        if (!r || !r.success) {
          toast((r && r.error) || 'Tidak ada artikel baru untuk dibuatkan template');
          loadBotNews();
          return;
        }
        botFbTplShowResult(r.title, r.imageUrl, r.caption);
        loadBotNews();
      }).withFailureHandler(e=>{
        showActionPopup('ERROR', 'Gagal Generate', (e&&e.message)||String(e), 'fa-triangle-exclamation');
      }).botFbTemplateGenerate(currentSessionToken);
    }
    async function botFbTplCopyImage(){
      if (!botFbTplLastImageUrl) { toast('Tidak ada gambar untuk disalin'); return; }
      try {
        const resp = await fetch('/img?url=' + encodeURIComponent(botFbTplLastImageUrl));
        if (!resp.ok) throw new Error('gagal ambil gambar (status ' + resp.status + ')');
        const blob = await resp.blob();
        if (!blob.type.startsWith('image/')) throw new Error('server tidak mengembalikan gambar (' + (blob.type||'tipe tidak diketahui') + ')');
        const pngBlob = blob.type === 'image/png' ? blob : await new Promise((resolve, reject) => {
          const imgEl = new Image();
          imgEl.onload = () => {
            const cnv = document.createElement('canvas');
            cnv.width = imgEl.naturalWidth; cnv.height = imgEl.naturalHeight;
            cnv.getContext('2d').drawImage(imgEl, 0, 0);
            cnv.toBlob(b => b ? resolve(b) : reject(new Error('gagal konversi gambar')), 'image/png');
          };
          imgEl.onerror = () => reject(new Error('gagal muat gambar'));
          imgEl.src = URL.createObjectURL(blob);
        });
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
        toast('Gambar disalin — tinggal paste (Ctrl+V) ke Facebook');
      } catch (e) {
        toast('Gagal salin gambar: ' + ((e && e.message) || e) + ' — coba klik "buka gambar asli" lalu klik-kanan > Copy Image');
      }
    }
    function botFbTplCopyCaption(){
      const ta = document.getElementById('botFbTplCaption');
      if (!ta || !ta.value) { toast('Belum ada caption'); return; }
      navigator.clipboard.writeText(ta.value).then(()=>toast('Caption disalin ke clipboard')).catch(()=>{
        ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly', 'true');
        toast('Caption disalin ke clipboard');
      });
    }
    function toggleBotAutoPost(){
      const cb = document.getElementById('botEnabled');
      const next = !(cb && cb.checked);
      if (cb) cb.checked = next;
      renderBotAutoBar(next);
      toast(next ? 'Mengaktifkan auto-post…' : 'Mematikan auto-post…');
      saveBotNewsConfig();
    }
    function applyBotNews(snap){
      if (!snap || !snap.success) return;
      const c = snap.config || {};
      botHistoryCache = snap.history || [];
      renderBotHistory();
      const set = (id,v)=>{ const el=document.getElementById(id); if(el){ if(el.type==='checkbox') el.checked=!!v; else el.value=(v==null?'':v); } };
      set('botEnabled', c.enabled); set('botAttribution', c.attribution);
      renderBotAutoBar(!!c.enabled);
      set('botPerRun', c.per_run); set('botDailyCap', c.daily_cap);
      set('botParaMin', c.para_min); set('botParaMax', c.para_max);
      set('botLabels', c.post_labels); set('botPromoUrl', c.promo_url); set('botPromoText', c.promo_text);
      set('botModel', c.gemini_model); set('botStyle', c.rewrite_style);
      set('botBlogId', c.blog_id);
      set('botFbEnabled', c.fb_enabled); set('botFbPageId', c.fb_page_id); set('botFbPageUrl', c.fb_page_url);
      const hint = document.getElementById('botCredHint');
      if (hint) hint.textContent = (c.has_gemini_key?'Gemini key OK':'Gemini key BELUM ada') + ' · ' + (c.has_blogger?'Blogger OK':'Blogger BELUM tersambung');
      const fbHint = document.getElementById('botFbHint');
      if (fbHint) fbHint.textContent = c.has_facebook ? 'Facebook Page OK' : 'Facebook belum tersambung';

      // Template FB (siapkan gambar+caption utk posting manual)
      const tplQueue = document.getElementById('botFbTplQueue'); if (tplQueue) tplQueue.textContent = snap.fbDirectQueue||0;
      botFbTplHistoryCache = snap.fbDirectHistory||[];
      const tplList = document.getElementById('botFbTplHistoryList');
      if (tplList) tplList.innerHTML = botFbTplHistoryCache.map(h=>{
        const t = String(h.fb_direct_posted_at||'').slice(0,16).replace('T',' ');
        return `<div class="flex items-start gap-2 border-b border-white/5 pb-1.5">
          <span class="text-[9px] text-slate-500 whitespace-nowrap mt-0.5">${botEsc(t)}</span>
          <div class="flex-1 min-w-0">
            <div class="text-slate-100 truncate">${botEsc(h.title)}</div>
            <span class="text-[9px] text-slate-500">${botEsc(h.source)}</span> ·
            <a href="${botEsc(h.post_url||h.url)}" target="_blank" class="text-[9px] text-blue-400 hover:text-blue-300">link asli</a>
          </div>
          <button onclick="botFbTplReopen(${Number(h.id)})" class="text-[9px] font-bold text-cyan-300 hover:text-cyan-200 whitespace-nowrap px-2 py-1 rounded-lg glass-inner"><i class="fa-solid fa-rotate-left mr-1"></i>BUKA LAGI</button>
        </div>`;
      }).join('') || '<div class="text-[11px] text-slate-500">Belum ada yang di-generate.</div>';

      const bs = snap.byStatus || {};
      const stat = document.getElementById('botNewsStat');
      if (stat) stat.innerHTML = [
        ['Diposting hari ini', snap.postedToday||0],
        ['Antre (new)', bs.new||0],
        ['Total diposting', bs.posted||0],
        ['Error', bs.error||0]
      ].map(x=>`<div class="mini-card"><div class="text-[10px] text-slate-400 font-semibold">${x[0]}</div><div class="text-xl font-black mt-1 text-slate-50">${x[1]}</div></div>`).join('');

      const sl = document.getElementById('botSourceList');
      if (sl) sl.innerHTML = (snap.sources||[]).map(s=>`
        <div class="flex items-center gap-2 glass-inner rounded-xl px-3 py-2">
          <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${s.active?'bg-emerald-500/15 text-emerald-300':'bg-slate-500/15 text-slate-400'}">${s.active?'ON':'OFF'}</span>
          <div class="flex-1 min-w-0"><div class="text-xs text-slate-100 font-semibold truncate">${botEsc(s.name)} <span class="text-slate-500">(${botEsc(s.kind)})</span></div><div class="text-[10px] text-slate-500 truncate">${botEsc(s.url)}</div></div>
          <button onclick="toggleBotSource(${s.id},${s.active?0:1})" class="text-[10px] text-cyan-300 font-bold">${s.active?'Matikan':'Nyalakan'}</button>
          <button onclick="deleteBotSource(${s.id})" class="text-[10px] text-rose-300 font-bold">Hapus</button>
        </div>`).join('') || '<div class="text-[11px] text-slate-500">Belum ada sumber.</div>';

      const al = document.getElementById('botArticleList');
      if (al) al.innerHTML = (snap.recent||[]).map(a=>{
        const badge = {posted:'bg-emerald-500/15 text-emerald-300',new:'bg-cyan-500/15 text-cyan-300',error:'bg-rose-500/15 text-rose-300',skipped:'bg-slate-500/15 text-slate-400'}[a.status]||'bg-slate-500/15 text-slate-300';
        return `<div class="glass-inner rounded-xl px-3 py-2">
          <div class="flex items-center gap-2">
            <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${badge}">${botEsc(a.status)}</span>
            <span class="text-[10px] text-slate-500">${botEsc(a.source)}</span>
            ${a.status==='new'||a.status==='error'?`<button onclick="skipBotArticle(${a.id})" class="text-[10px] text-slate-400 ml-auto">skip</button>`:''}
          </div>
          <div class="text-xs text-slate-100 mt-1">${botEsc(a.title)}</div>
          <div class="text-[10px] mt-1 flex gap-3">
            <a href="${botEsc(a.url)}" target="_blank" class="text-slate-500 hover:text-slate-300">sumber</a>
            ${a.post_url?`<a href="${botEsc(a.post_url)}" target="_blank" class="text-emerald-400">hasil post</a>`:''}
            ${a.error?`<span class="text-rose-400 truncate">${botEsc(a.error)}</span>`:''}
          </div>
        </div>`;
      }).join('') || '<div class="text-[11px] text-slate-500">Belum ada artikel.</div>';
    }

    function loadBotNews(){
      google.script.run.withSuccessHandler(applyBotNews).withFailureHandler(e=>toast('BOT: '+((e&&e.message)||e))).botNewsStatus(currentSessionToken);
    }
    function saveBotNewsConfig(){
      const g=id=>{const el=document.getElementById(id);return !el?'':(el.type==='checkbox'?(el.checked?'1':'0'):String(el.value||'').trim());};
      const data={enabled:g('botEnabled'),attribution:g('botAttribution'),per_run:g('botPerRun'),daily_cap:g('botDailyCap'),para_min:g('botParaMin'),para_max:g('botParaMax'),post_labels:g('botLabels'),promo_url:g('botPromoUrl'),promo_text:g('botPromoText'),gemini_model:g('botModel'),rewrite_style:g('botStyle'),blogger_blog_id:g('botBlogId'),fb_enabled:g('botFbEnabled'),fb_page_id:g('botFbPageId'),fb_page_url:g('botFbPageUrl')};
      const key=g('botGeminiKey'); if(key) data.gemini_key=key;
      const fbTok=g('botFbToken'); if(fbTok) data.fb_page_token=fbTok;
      google.script.run.withSuccessHandler(s=>{toast('Konfigurasi BOT tersimpan');['botGeminiKey','botFbToken'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});applyBotNews(s);}).withFailureHandler(e=>toast('Gagal: '+((e&&e.message)||e))).botNewsSaveConfig(currentSessionToken,data);
    }
    function addBotSource(){
      const data={name:document.getElementById('botSrcName').value.trim(),kind:document.getElementById('botSrcKind').value,url:document.getElementById('botSrcUrl').value.trim()};
      if(!data.name||!data.url){toast('Isi nama & URL feed');return;}
      google.script.run.withSuccessHandler(s=>{toast('Sumber ditambah');document.getElementById('botSrcName').value='';document.getElementById('botSrcUrl').value='';applyBotNews(s);}).withFailureHandler(e=>toast('Gagal: '+((e&&e.message)||e))).botNewsAddSource(currentSessionToken,data);
    }
    function toggleBotSource(id,active){ google.script.run.withSuccessHandler(applyBotNews).withFailureHandler(e=>toast('Gagal: '+((e&&e.message)||e))).botNewsToggleSource(currentSessionToken,{id:id,active:String(active)}); }
    function deleteBotSource(id){ if(!confirm('Hapus sumber ini?'))return; google.script.run.withSuccessHandler(applyBotNews).withFailureHandler(e=>toast('Gagal: '+((e&&e.message)||e))).botNewsDeleteSource(currentSessionToken,{id:id}); }
    function skipBotArticle(id){ google.script.run.withSuccessHandler(applyBotNews).withFailureHandler(e=>toast('Gagal: '+((e&&e.message)||e))).botNewsSkip(currentSessionToken,{id:id}); }
    function botNewsRun(){
      const countEl = document.getElementById('botRunCount');
      const count = countEl ? Number(countEl.value || 1) : 1;
      showActionPopup('LOADING', 'Memproses Berita', `Menulis ulang & posting ${count} artikel ke Blogger...`, 'fa-robot');
      google.script.run.withSuccessHandler(r=>{
        closeActionPopup();
        if (r && r.message) toast(r.message);
        else toast('Tidak ada artikel baru untuk diproses');
        if(r&&r.snapshot) applyBotNews(r.snapshot); else loadBotNews();
      }).withFailureHandler(e=>{
        showActionPopup('ERROR', 'Proses Gagal', (e&&e.message)||String(e), 'fa-triangle-exclamation');
      }).botNewsRunNow(currentSessionToken, count);
    }
  </script>
