    // Data hasil 1x panggilan getBootstrapData saat panel dibuka. Dipakai sekali lalu

    let bootstrapPrefetch = null;

    let resultData = {};
    let currentProfile = null;
    let pendingSendText = ""; let pendingPreview = null; let lastSendResult = null; let maintenanceState = false; let inactivityTimer; let adminUsersData = []; let activePredictionIndex = null; let activePredictionKind = "schedule"; let activeClosingSlot = ""; let lastPredictionPendingWebsites = [];
    const activityViews = { activity:{page:1,pageSize:75}, admin:{page:1,pageSize:75} };

    /* ===== FX: micro-interaction bergaya animejs.com (staggered reveal, count-up,
       spring pop). Semua opsional — kalau anime.js gagal dimuat atau user pilih
       reduced-motion, panel tetap jalan normal tanpa animasi. Durasi sengaja
       pendek (<=520ms) supaya tidak menghambat kerja CS. ===== */
    const FX = {
      get on() {
        try {
          if (!window.anime) return false;
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
          return localStorage.getItem('dg_fx') !== 'off';
        } catch (e) { return !!window.anime; }
      },
      // baris/kartu muncul dengan efek naik + skala, di-stagger.
      // PENTING: begitu selesai, inline transform/opacity DIBERSIHKAN — kalau
      // dibiarkan, ratusan <tr> memegang layer compositor sendiri -> scroll berat.
      reveal(nodes, opt) {
        opt = opt || {};
        const list = (nodes && nodes.length != null) ? Array.from(nodes) : (nodes ? [nodes] : []);
        if (!list.length) return;
        const clear = () => list.forEach(n => { n.style.opacity = ''; n.style.transform = ''; n.style.willChange = ''; });
        if (!FX.on) { clear(); return; }
        anime.remove(list);
        anime({
          targets: list,
          opacity: [0, 1],
          translateY: [opt.y != null ? opt.y : 10, 0],
          scale: [opt.scale != null ? opt.scale : 0.985, 1],
          duration: opt.duration || 460,
          delay: anime.stagger(opt.step || 42, { start: opt.start || 0 }),
          easing: opt.easing || 'cubicBezier(.2,.8,.2,1)',
          complete: clear
        });
      },
      // kartu-kartu utama pada sebuah halaman
      page(container) {
        if (!container) return;
        const sel = container.querySelectorAll(':scope > .glass-card, :scope > .grid > .glass-card, :scope > div > .glass-card');
        FX.reveal(sel.length ? sel : container.querySelectorAll(':scope > *'), { y: 14, step: 55, duration: 480 });
      },
      // angka menghitung naik dari 0; format ribuan otomatis. el butuh data-fx-count.
      // Guard: HANYA jalan kalau data-fx-count = satu angka bersih (mis. "1,234"),
      // bukan string gabungan seperti "2 (2,632,014,000)" -- kalau tidak match,
      // dibiarkan apa adanya tanpa count-up supaya nilai gabungan tidak rusak.
      countUp(root) {
        const els = (root || document).querySelectorAll('[data-fx-count]');
        els.forEach(el => {
          const raw = String(el.getAttribute('data-fx-count')).trim();
          if (!/^-?[0-9][0-9,]*(\.[0-9]+)?$/.test(raw)) return;
          const to = Number(raw.replace(/,/g, '')) || 0;
          if (el.getAttribute('data-fx-done') === String(to)) return;
          el.setAttribute('data-fx-done', String(to));
          if (!FX.on) { el.textContent = to.toLocaleString('en-US'); return; }
          const obj = { v: 0 };
          anime({
            targets: obj, v: to, duration: Math.min(900, 260 + Math.log10(Math.max(to, 1)) * 220),
            easing: 'easeOutExpo',
            update: () => { el.textContent = Math.round(obj.v).toLocaleString('en-US'); }
          });
        });
      },
      // "denyut" spring kecil saat sebuah nilai berubah (pasaran, angka 2D)
      pop(el) {
        if (!el || !FX.on) return;
        anime.remove(el);
        anime({ targets: el, scale: [0.82, 1], opacity: [0.35, 1], duration: 520, easing: 'spring(1, 80, 12, 0)' });
      },
      // reveal teks huruf-per-huruf dengan "scramble" (acak) sebelum mengunci.
      // el hanya boleh berisi teks (mis. #market). Aman: kalau FX mati -> set teks biasa.
      scramble(el, opt) {
        opt = opt || {};
        if (!el) return;
        const finalText = (opt.text != null ? String(opt.text) : el.textContent) || '';
        if (!FX.on) { el.textContent = finalText; return; }
        const glyphs = opt.glyphs || 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        const step = opt.step || 30;
        el.textContent = '';
        const spans = finalText.split('').map(ch => {
          const s = document.createElement('span');
          s.textContent = ch === ' ' ? ' ' : ch;
          s.style.display = 'inline-block';
          s.style.opacity = '0';
          el.appendChild(s);
          return { s, ch };
        });
        spans.forEach((it, i) => {
          if (it.ch === ' ') { it.s.style.opacity = '1'; return; }
          const st = { p: 0 };
          anime({
            targets: st, p: 1, duration: 460, delay: i * step + (opt.start || 0), easing: 'easeOutQuad',
            update: () => {
              it.s.style.opacity = String(Math.min(1, st.p * 2));
              it.s.textContent = st.p < 0.75 ? glyphs[(Math.random() * glyphs.length) | 0] : it.ch;
            },
            complete: () => { it.s.style.opacity = '1'; it.s.textContent = it.ch; }
          });
        });
      },
      // reveal saat elemen masuk viewport (daftar/tabel panjang). Sekali jalan.
      scrollReveal(nodes, opt) {
        const list = FX._list ? FX._list(nodes) : ((nodes && nodes.length != null) ? Array.from(nodes) : (nodes ? [nodes] : []));
        if (!list.length) return;
        if (!FX.on || !('IntersectionObserver' in window)) { list.forEach(n => { n.style.opacity=''; n.style.transform=''; }); return; }
        list.forEach(n => { n.style.opacity = '0'; });
        const io = new IntersectionObserver((entries, obs) => {
          const vis = entries.filter(e => e.isIntersecting).map(e => e.target);
          if (vis.length) { FX.reveal(vis, opt || { y: 14, step: 26, duration: 420 }); vis.forEach(t => obs.unobserve(t)); }
        }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
        list.forEach(n => io.observe(n));
      },
      _list(nodes) { return (nodes && nodes.length != null) ? Array.from(nodes) : (nodes ? [nodes] : []); },
      // urutan masuk saat panel terbuka (login / resume sesi)
      enter() {
        if (!FX.on) return;
        try {
          const tl = anime.timeline({ easing: 'cubicBezier(.2,.8,.2,1)', duration: 520 });
          const header = document.querySelector('#app-container .header-frozen');
          const sidebar = document.querySelector('#app-container .sidebar-frozen');
          const navs = document.querySelectorAll('#app-container .nav-group, #app-container .nav-solo');
          const content = document.querySelectorAll('#main-panel > .grid > *, #main-panel > .glass-card');
          if (sidebar) tl.add({ targets: sidebar, opacity: [0, 1], translateX: [-18, 0] }, 0);
          if (header) tl.add({ targets: header, opacity: [0, 1], translateY: [-14, 0] }, 60);
          if (navs.length) tl.add({ targets: navs, opacity: [0, 1], translateX: [-10, 0], delay: anime.stagger(38) }, 140);
          if (content.length) tl.add({ targets: content, opacity: [0, 1], translateY: [14, 0], scale: [0.98, 1], delay: anime.stagger(50) }, 220);
        } catch (e) {}
      }
    };

    /* ===== Navigasi instan + auto-refresh "realtime" (polling adaptif) =====
       Apps Script tak punya WebSocket/SSE, jadi panel polling 1 endpoint gabungan
       (getLivePanelData) dengan interval yang menyesuaikan keaktifan user & tab. */
    let currentPage = 'home';
    let currentAdminPanel = 'dashboard';                    // tab admin yang sedang dibuka

    const NAV_FRESH_MS = 12000;   // data < 12 dtk dianggap masih segar saat pindah menu
    const shioIcons = { "KUDA": "🐴", "ULAR": "🐍", "NAGA": "🐉", "KELINCI": "🐇", "HARIMAU": "🐅", "KERBAU": "🐃", "TIKUS": "🐀", "BABI": "🐖", "ANJING": "🐕", "AYAM": "🐓", "MONYET": "🐒", "KAMBING": "🐐" };
    // =========================================================

      FOLA:  {name:'FOLATOTO', primary:'#2593CF', secondary:'#1B56B1', accent:'#0FA7F4', bg:'#07121A', panel:'#13366D'},
      LIMA:  {name:'LIMATOGEL', primary:'#41e0ff', secondary:'#19b5ff', accent:'#ffe34f', bg:'#08131f', panel:'#102436'},
      SOHO:  {name:'SOHOTOGEL', primary:'#8dfd27', secondary:'#39d353', accent:'#ffd447', bg:'#081108', panel:'#122112'},
      RETRO: {name:'RETROTOGEL', primary:'#ffd84f', secondary:'#ffb100', accent:'#ff5449', bg:'#120d08', panel:'#24190f'},

      XO:    {name:'XOTOGEL', primary:'#34d9ff', secondary:'#1eb8c9', accent:'#86efac', bg:'#07151a', panel:'#0e242b'},
      SENJA: {name:'SENJATOGEL', primary:'#ff9f43', secondary:'#ff5ca8', accent:'#b46cff', bg:'#1b0c17', panel:'#301626'}

    const SITE_THEME_ALIASES = {

    const SITE_LOGO_PRESETS = {

      FOLA:{single:'https://i.ibb.co/yBSPW0jy/image.png', pair:'https://i.ibb.co/21NSfyWh/image.png'},

    function normalizeThemeWebsite(value) {
      const raw = String(value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      return SITE_THEME_ALIASES[raw] || raw;
    }

    function hexToRgbTuple(hex) {
      const clean = String(hex || '#000000').replace('#','');
      const full = clean.length === 3 ? clean.split('').map(x => x+x).join('') : clean.padEnd(6,'0').slice(0,6);
      return [parseInt(full.slice(0,2),16)||0, parseInt(full.slice(2,4),16)||0, parseInt(full.slice(4,6),16)||0];
    }

    function rgbTupleToHex(rgb) {
      return '#' + rgb.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
    }

    function mixThemeColor(colors, offset) {
      if (!colors.length) return '#22d3ee';
      const tuples = colors.map(hexToRgbTuple);
      const shifted = tuples.map((c,i) => c.map((v,k) => Math.min(255, v * (1 + (((i+k+offset)%3)-1) * .035))));
      return rgbTupleToHex([0,1,2].map(k => shifted.reduce((s,c)=>s+c[k],0)/shifted.length));
    }

    function setThemeCssVariable(name, hex) {
      const root = document.documentElement;
      root.style.setProperty(name, hex);
      root.style.setProperty(name + '-rgb', hexToRgbTuple(hex).join(','));
    }

    function buildWebsiteTheme(websites) {
      const keys = [...new Set((Array.isArray(websites) ? websites : String(websites || '').split(','))
        .map(normalizeThemeWebsite).filter(Boolean))];
      const themes = keys.map(k => SITE_THEME_PRESETS[k]).filter(Boolean);

      if (!themes.length) {
        return {keys:[], names:['DAY-GROUP'], primary:'#22d3ee', secondary:'#3b82f6', accent:'#f472b6', bg:'#020617', panel:'#0f172a', fusion:false};
      }
      if (themes.length === 1) {
        const t = themes[0];
        return {keys, names:[t.name], primary:t.primary, secondary:t.secondary, accent:t.accent, bg:t.bg, panel:t.panel, fusion:false};
      }

      // Multi-site final logic:
      // - website pertama = theme dominan
      // - website kedua = warna sekunder utama
      // - website ketiga dan seterusnya = penguat accent
      // Background/panel dirata-ratakan agar tetap elegan dan tidak berantakan.
      const primary = themes[0].primary;
      const secondary = themes[1].secondary || themes[1].primary || themes[0].secondary;
      const accent = themes.length === 2 ? (themes[1].accent || themes[0].accent) : mixThemeColor(themes.map(t=>t.accent || t.primary), 1);
      const bg = mixThemeColor(themes.map(t=>t.bg), 2);
      const panel = mixThemeColor(themes.map(t=>t.panel), 0);
      return {keys, names:themes.map(t=>t.name), primary, secondary, accent, bg, panel, fusion:true};
    }


    function renderSidebarSiteLogos(websites) {
      const wrap = document.getElementById('sidebar-site-logos');
      if (!wrap) return [];
      const keys = [...new Set((Array.isArray(websites) ? websites : String(websites || '').split(','))
        .map(normalizeThemeWebsite).filter(key => !!SITE_LOGO_PRESETS[key]))];

      if (!keys.length) {
        wrap.style.display = 'none';
        wrap.innerHTML = '';
        return [];
      }

      if (keys.length === 1) {
        const key = keys[0];
        const meta = SITE_LOGO_PRESETS[key];
        wrap.innerHTML = `
          <div class="site-logo-single">
            <div class="site-logo-item" title="${escapeHtml((SITE_THEME_PRESETS[key] && SITE_THEME_PRESETS[key].name) || key)}">
              <img src="${meta.single}" alt="${escapeHtml(key)} logo" loading="lazy" decoding="async" referrerpolicy="no-referrer">
            </div>
          </div>`;
      } else {
        const shown = keys.slice(0, 2);
        const logoItems = shown.map(key => {
          const meta = SITE_LOGO_PRESETS[key];
          return `
            <div class="site-logo-item" title="${escapeHtml((SITE_THEME_PRESETS[key] && SITE_THEME_PRESETS[key].name) || key)}">
              <img src="${meta.pair}" alt="${escapeHtml(key)} logo" loading="lazy" decoding="async" referrerpolicy="no-referrer">
            </div>`;
        }).join('');
        wrap.innerHTML = `
          <div class="site-logo-pair">${logoItems}</div>
          ${keys.length > 2 ? `<div class="site-logo-more"><i class="fa-solid fa-layer-group"></i>+${keys.length - 2} website</div>` : ''}`;
      }
      wrap.style.display = 'block';
      return keys;
    }

    function applyWebsiteTheme(websites) {
      const theme = buildWebsiteTheme(websites || (currentProfile && currentProfile.websites) || []);
      document.body.classList.add('theme-dynamic');
      document.body.classList.toggle('theme-fusion', !!theme.fusion);
      document.body.dataset.themeSites = theme.keys.join(',');
      setThemeCssVariable('--theme-primary', theme.primary);
      setThemeCssVariable('--theme-secondary', theme.secondary);
      setThemeCssVariable('--theme-accent', theme.accent);
      setThemeCssVariable('--theme-bg', theme.bg);
      setThemeCssVariable('--theme-panel', theme.panel);
      document.documentElement.style.setProperty('--theme-panel-rgb', hexToRgbTuple(theme.panel).join(','));

      const badge = document.getElementById('theme-sites');
      const label = document.getElementById('theme-sites-label');
      if (label) {
        const max = 3;
        const shown = theme.names.slice(0,max);
        label.textContent = shown.join(' + ') + (theme.names.length > max ? ` +${theme.names.length-max}` : '');
        label.title = theme.names.join(' + ');
      }
      if (badge) badge.style.display = currentProfile ? 'inline-flex' : 'none';
      renderSidebarSiteLogos(theme.keys);
      return theme;
    }

    function resetWebsiteTheme() {
      document.body.classList.remove('theme-fusion');
      applyWebsiteTheme([]);
      const badge = document.getElementById('theme-sites');
      if (badge) badge.style.display = 'none';
      const logoWrap = document.getElementById('sidebar-site-logos');
      if (logoWrap) { logoWrap.style.display = 'none'; logoWrap.innerHTML = ''; }
    }


    function clearLocalSession() {
      localStorage.removeItem("daygroup_session");
      localStorage.removeItem("daygroup_user");
      localStorage.removeItem("daygroup_profile");
      currentSessionToken = "";
      currentUser = "";
      currentProfile = null;
      resetWebsiteTheme();
    }

    function openLoginScreen(message) {
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.body.classList.add('justify-center');
      const maintModal = document.getElementById('maintenanceModal');
      if (maintModal) maintModal.classList.remove('open');
      document.body.classList.remove('modal-open');
      if (message) document.getElementById('login-err').innerText = message;
    }

    function applyAuthenticatedSession(res, tokenOverride) {
      currentSessionToken = String(tokenOverride || res.sessionToken || currentSessionToken || '');
      currentUser = String(res.user || res.username || '');
      currentProfile = res;
      localStorage.setItem("daygroup_session", currentSessionToken);
      localStorage.setItem("daygroup_user", currentUser);
      localStorage.setItem("daygroup_profile", JSON.stringify(res));
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      document.body.classList.remove('justify-center');
      document.getElementById('sidebar-user').innerText = currentUser.toUpperCase();
      // masuk panel: sidebar dari kiri, header dari atas, menu & konten di-stagger
      setTimeout(() => FX.enter(), 30);
      applyWebsiteTheme(res.websites || []);
      // switchPage('home') sudah memanggil loadHeaderSummary() di bagian akhirnya,
      // jadi tidak perlu dipanggil lagi di sini (dulu jadi 2x panggil server).
      const botOnly = res && res.role === 'BOT';
      applyProfileUI(); restoreDraft(); resetSessionTimer();
      switchPage(botOnly ? 'bot-dashboard' : 'home');
      // Kunci maintenance dievaluasi begitu panel terbuka (login / resume sesi).
      if (res && res.maintenance) setMaintenanceLock(res.maintenance.enabled, res.maintenance.message);
      if (!botOnly) startLivePolling();
    }

    /* ===== MODE MAINTENANCE — overlay otomatis untuk NON-ADMIN =====
       Dipanggil dari: login, resume sesi, live-poll, dan render dashboard.
       Muncul/hilang sendiri tanpa refresh. Admin tidak pernah melihat overlay ini. */
    function setMaintenanceLock(enabled, message) {
      const modal = document.getElementById('maintenanceModal');
      if (!modal) return;
      const isAdmin = !!(currentProfile && currentProfile.role === 'ADMIN');
      // Untuk ADMIN, jangan sentuh maintenanceState (dikelola switch + saveMaintenance
      // sebagai optimistic UI); admin tidak pernah melihat overlay.
      if (isAdmin) return;
      maintenanceState = !!enabled;
      const wasOpen = modal.classList.contains('open');

      if (enabled && currentUser) {
        const msgEl = document.getElementById('maintenanceModalMessage');
        if (msgEl) msgEl.textContent = String(message || 'Panel sedang dalam pemeliharaan. Mohon tunggu sebentar.');
        if (!wasOpen) {
          modal.classList.add('open');
          document.body.classList.add('modal-open');
        }
      } else if (wasOpen) {
        modal.classList.remove('open');
        if (!document.querySelector('.modal-shell.open')
            && !document.getElementById('centerNoticeModal').classList.contains('open')
            && document.getElementById('actionPopup').style.display === 'none') {
          document.body.classList.remove('modal-open');
        }
        if (!enabled && currentUser) toast('Panel kembali aktif');
      }
    }

    function renderHeaderSummary(box, data) {
      if (!box) return;
      const s = (data && data.stats) || {};
      const failed = Number(s.failed || 0);
      const first = !box.querySelector('.header-stat-dot');
      box.innerHTML = `
        <span class="header-stat"><span class="header-stat-dot ok"></span><b data-fx-count="${Number(s.success||0)}">${Number(s.success||0)}</b>&nbsp;Berhasil</span>
        <span class="header-stat"><span class="header-stat-dot ${failed > 0 ? 'bad' : 'ok'}"></span><b data-fx-count="${failed}">${failed}</b>&nbsp;Gagal</span>
        <span class="header-stat"><span class="header-stat-dot info"></span><b data-fx-count="${Number(s.sends||0)}">${Number(s.sends||0)}</b>&nbsp;Pengiriman</span>
        <span class="header-stat"><span class="header-stat-dot info"></span><b data-fx-count="${Number(s.today||0)}">${Number(s.today||0)}</b>&nbsp;Total Aktivitas</span>
      `;

    window.addEventListener("DOMContentLoaded", () => {

          if (res && res.success && res.profile) {
            // Simpan ringkasan header yang ikut terkirim, lalu buka panel.
            bootstrapPrefetch = res;
            applyAuthenticatedSession(res.profile, currentSessionToken);

    document.getElementById('pass').addEventListener('keypress', function (e) { if (e.key === 'Enter') { handleLogin(); } });

    function handleLogin() {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('login-err');
      if(!u || !p) { err.innerText = "Lengkapi data!"; return; }
      err.innerText = '';
      btn.innerText = "MEMVERIFIKASI...";
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(res => {
          btn.innerText = "LOGIN";
          btn.disabled = false;
          if(res && res.success) {
            applyAuthenticatedSession(res, res.sessionToken);
            toast("Selamat Datang, " + res.user);
          } else {
            err.innerText = (res && res.message) || 'Login gagal.';
          }
        })
        .withFailureHandler(error => {
          btn.innerText = "LOGIN";
          btn.disabled = false;
          err.innerText = (error && error.message) || 'Tidak dapat menghubungi server.';
        })
        .checkLogin(u, p);

    function switchPage(page) {
      const pages = {
        home:'main-panel', prediction:'prediction-page', activity:'activity-page',
        admin:'admin-page', invest:'invest-page',
        'lap-admin':'lap-page', 'lap-motion':'lap-page', 'lap-mozart':'lap-page', 'lap-setting':'lap-page',
        'bot-dashboard':'bot-page', 'bot-sources':'bot-page', 'bot-history':'bot-page', 'bot-fbdirect':'bot-page', 'bot-config':'bot-page'
      };
      ['main-panel','prediction-page','activity-page','admin-page','invest-page','bot-page','lap-page'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });

      hideToast();
      const target = document.getElementById(pages[page] || 'main-panel');
      if (target) { target.style.display = 'flex'; if (page !== currentPage) FX.page(target); }

      const marketWrapper = document.getElementById('market-wrapper');
      if (marketWrapper) marketWrapper.style.display = page === 'home' ? 'block' : 'none';

      NAV_KEYS.forEach(key => {
        const nav = document.getElementById('nav-' + key);
        if (nav) nav.classList.toggle('nav-active', key === page);
      });

      const kicker = document.getElementById('headerKicker');
      if (kicker) kicker.textContent = HEADER_KICKER[page] || 'DAY-GROUP PANEL';

      if (LAP_PAGES.includes(page)) renderLapPage(page);
      if (BOT_PAGES.includes(page)) renderBotSubpage(page);

      if (page !== 'invest') stopInvestPolling();
      if (page !== 'lap-admin') clearTimeout(lapAdminPollTimer);

      // "home" adalah halaman paling sering diklik (default landing) -- skip log di sini
      // biar tidak nambah beban lock/tulis sheet tiap kali orang balik ke Beranda.
      if (currentUser && page !== 'home') {
        google.script.run.withFailureHandler(() => {}).logClientActivity(
          currentSessionToken,
          'BUKA HALAMAN',
          page.toUpperCase(),
          'INFO',
          ''
        );
      }

      currentPage = page;

      if (page === 'prediction') {
        if (Date.now() - pageFetchedAt.prediction > NAV_FRESH_MS) loadPredictionStatus();
      }

      if (page === 'activity') {
        // Render instan dari cache (0 ms) -> refresh diam-diam hanya bila sudah basi.
        if (pageDataCache.activity) applyDashboardData(pageDataCache.activity, 'activity', true);
        if (!pageDataCache.activity || Date.now() - pageFetchedAt.activity > NAV_FRESH_MS) {
          loadDashboard(false, 'activity');
        }
      }

      if (page === 'admin') {

        let savedTab = 'dashboard';
        try { savedTab = localStorage.getItem('daygroup_admin_tab') || 'dashboard'; } catch (e) {}
        switchAdminPanel(savedTab, true);

      if (page === 'invest') {
        loadInvestConfig();

      if (BOT_PAGES.includes(page)) {
        return; // BOT: jangan sentuh header summary / live poll (endpoint ditolak) -- data dimuat oleh renderBotSubpage
      }

      // Header sudah dipoll oleh live-poll; muat manual hanya kalau belum pernah terisi.
      if (!headerSummaryLoadedOnce) loadHeaderSummary();

      pumpLivePoll(true); // sinkron cepat sesuai halaman baru

    // ================= LAPORAN HARIAN (port PANEL AUTO) =================
    let lapConfig = null;

    function lapEnsureConfig(cb) {
      if (lapConfig) { cb && cb(); return; }
      google.script.run.withSuccessHandler(res => {
        if (res && res.success) { lapConfig = res.config || {}; lapResults = res.results || {}; }
        cb && cb();
      }).withFailureHandler(() => cb && cb()).lapGetConfig(currentSessionToken);
    }

    // Paksa ambil ulang hasil dari server (mis. setelah impor Mozart dari Console).
    function lapRefresh(page) {
      google.script.run.withSuccessHandler(res => {
        if (res && res.success) { lapConfig = res.config || {}; lapResults = res.results || {}; }
        renderLapPage(page);
        toast('Data diperbarui');
      }).withFailureHandler(() => { renderLapPage(page); toast('Gagal memuat ulang'); })
        .lapGetConfig(currentSessionToken);

    function renderLapPage(page) {
      const host = document.getElementById('lap-page');

        else if (page === 'lap-motion') lapRenderMotion(host);
        else if (page === 'lap-mozart') lapRenderMozart(host);

          FX.reveal(card.querySelectorAll(':scope > .grid > .glass-inner, :scope > .grid > div'), { y: 12, step: 34 });

    function lapHeaderCard(icon, title, sub, inner) {
      return `<div class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col gap-4">

          <div class="min-w-0"><h2 class="text-base font-extrabold text-white tracking-tight leading-tight">${title}</h2><p class="text-[11px] text-slate-400 mt-0.5">${sub}</p></div>

    const lapFp = {}; // instance flatpickr per prefix
    function lapDateBar(prefix, onRun) {
      window['__lapRun_' + prefix] = onRun;
      // init flatpickr sesudah HTML dipasang
      setTimeout(() => {
        try {
          if (window.flatpickr) {
            ['Start','End'].forEach(k => {
              const el = document.getElementById(prefix + k);
              if (el && !el._flatpickr) {
                lapFp[prefix+k] = flatpickr(el, { dateFormat:'Y-m-d', altInput:true, altFormat:'d-m-Y', defaultDate: lapToday(), allowInput:false, disableMobile:true });
              }
            });
          }
        } catch(e) {}
      }, 30);
      return `<div class="lap-datebar flex flex-wrap items-end gap-3">
        <div class="flex flex-col gap-1"><label class="text-[10px] font-bold text-slate-400 tracking-wide">TANGGAL MULAI</label>
          <div class="lap-date-field"><i class="fa-regular fa-calendar"></i><input id="${prefix}Start" value="${lapToday()}" readonly placeholder="dd-mm-yyyy"></div></div>
        <div class="flex flex-col gap-1"><label class="text-[10px] font-bold text-slate-400 tracking-wide">TANGGAL SELESAI</label>
          <div class="lap-date-field"><i class="fa-regular fa-calendar"></i><input id="${prefix}End" value="${lapToday()}" readonly placeholder="dd-mm-yyyy"></div></div>
        <div class="flex gap-1.5">
          <button onclick="lapSetRange('${prefix}',0)" class="lap-quick">Hari ini</button>
          <button onclick="lapSetRange('${prefix}',1)" class="lap-quick">Kemarin</button>
          <button onclick="lapSetRange('${prefix}',7)" class="lap-quick">7 hari</button>
        </div>
        <button id="${prefix}Btn" onclick="window['__lapRun_${prefix}']()" class="bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl text-xs shrink-0"><i class="fa-solid fa-cloud-arrow-down mr-2"></i>TARIK DATA</button>
        <span id="${prefix}Status" class="text-[11px] text-slate-400"></span>
      </div>`;
    }
    function lapSetRange(prefix, daysBack) {
      const d = new Date(Date.now() + 7*3600*1000 - daysBack*864e5).toISOString().slice(0,10);
      const end = daysBack === 7 ? new Date(Date.now() + 7*3600*1000).toISOString().slice(0,10) : d;
      const setV = (id, v) => { const el = document.getElementById(id); if (el && el._flatpickr) el._flatpickr.setDate(v, true); else if (el) el.value = v; };
      setV(prefix+'Start', d); setV(prefix+'End', end);
    }
    function lapDateVal(id) {
      const el = document.getElementById(id);
      if (el && el._flatpickr && el._flatpickr.selectedDates[0]) return el._flatpickr.formatDate(el._flatpickr.selectedDates[0], 'Y-m-d');
      return el ? el.value : '';
    }
    function lapBusy(prefix, on, msg) {
      const b = document.getElementById(prefix + 'Btn'), s = document.getElementById(prefix + 'Status');
      if (b) { b.disabled = on; b.innerHTML = on ? '<i class="fa-solid fa-spinner fa-spin mr-2"></i>MENARIK...' : '<i class="fa-solid fa-cloud-arrow-down mr-2"></i>TARIK DATA'; }
      if (s) s.textContent = msg || '';
    }
    function lapStatCard(label, val, color) {
      // count-up HANYA kalau val = satu angka bersih (mis. "1,234"), BUKAN string
      // gabungan seperti "2 (2,632,014,000)" — jangan sampai formatnya rusak.
      const s = String(val).trim();
      const cnt = /^-?[0-9][0-9,]*(\.[0-9]+)?$/.test(s)
        ? ` data-fx-count="${s.replace(/,/g, '')}"` : '';
      return `<div class="glass-inner rounded-2xl p-3.5 border border-white/[0.05]"><div class="text-[9.5px] font-bold text-slate-400 uppercase tracking-[0.1em]">${label}</div><div class="text-[19px] font-black mt-1.5 tabular-nums ${color||'text-slate-50'}"${cnt}>${val}</div></div>`;
    }

    // Tabel collapsible + search bawaan. rows = array; rowFn(r,i)->'<tr>...'; copyFn(r,i)->string;
    // searchKeys = array field yang dicari; opts.open = buka default.
    const lapTblState = {};
    const LAP_PAGE_SIZE = 50;
    function lapTable(id, headers, rows, rowFn, copyFn, searchKeys, opts) {
      opts = opts || {};
      rows = rows || [];
      const title = (opts.title || id.replace(/_/g,' '));
      lapTblState[id] = { rows, rowFn, headers, searchKeys: searchKeys || [], copyFn, title, page:1, q:'', open:!!opts.open, prefilter: opts.prefilter || null, footer: opts.footer || '' };
      const st = lapTblState[id];
      window['__lapCopy_' + id] = (ev) => {
        ev && ev.stopPropagation();
        const list = lapTblFiltered(id);
        if (!list.length) { toast('Data kosong'); return; }
        navigator.clipboard.writeText(list.map((r,i) => copyFn(r,i)).join('\n')).then(() => toast(list.length + ' baris disalin'));
      };
      window['__lapToggle_' + id] = () => { st.open = !st.open; lapTblRepaint(id); };
      window['__lapSearch_' + id] = (v) => { st.q = (v||'').toLowerCase(); st.page = 1; lapTblRepaint(id, true); };
      return `<div class="lap-tbl" id="lapTbl_${id}">
        <div class="lap-tbl-head" onclick="window['__lapToggle_${id}']()">
          <span class="flex items-center gap-2"><i class="fa-solid fa-chevron-right lap-tbl-chev"></i>${title.toUpperCase()}
            <span class="lap-tbl-count" id="lapTblCount_${id}">${rows.length}</span></span>
          <button onclick="window['__lapCopy_${id}'](event)" class="lap-tbl-copy"><i class="fa-regular fa-copy mr-1"></i>COPY</button>
        </div>
        <div class="lap-tbl-body" id="lapTblBody_${id}"></div>
      </div>`;
    }
    function lapTblFiltered(id) {
      const st = lapTblState[id]; if (!st) return [];
      let list = st.prefilter ? st.prefilter(st.rows) : st.rows;
      if (st.q && st.searchKeys.length) list = list.filter(r => st.searchKeys.some(k => String(r[k]==null?'':r[k]).toLowerCase().includes(st.q)));
      return list;
    }
    function lapSetPrefilter(id, fn) { if (lapTblState[id]) { lapTblState[id].prefilter = fn; lapTblState[id].page = 1; lapTblState[id].open = true; lapTblRepaint(id); } }
    window.__lapPage = (id, delta) => {
      const st = lapTblState[id]; if (!st) return;
      const totalP = Math.max(1, Math.ceil(lapTblFiltered(id).length / LAP_PAGE_SIZE));
      st.page = Math.min(totalP, Math.max(1, (st.page||1) + delta));
      lapTblRepaint(id);
      document.getElementById('lapTbl_' + id)?.scrollIntoView({ block:'nearest' });
    };
    function lapTblRepaint(id, keepFocus) {
      const st = lapTblState[id]; if (!st) return;
      const wrap = document.getElementById('lapTbl_' + id);
      const body = document.getElementById('lapTblBody_' + id);
      if (!wrap || !body) return;
      wrap.classList.toggle('open', st.open);
      const cnt = document.getElementById('lapTblCount_' + id);
      if (!st.open) { body.innerHTML = ''; st._revealed = false; return; }
      const list = lapTblFiltered(id);
      if (cnt) cnt.textContent = list.length + (st.q ? '/' + st.rows.length : '');
      const totalP = Math.max(1, Math.ceil(list.length / LAP_PAGE_SIZE));
      if (!st.page || st.page > totalP) st.page = 1;
      const from = (st.page - 1) * LAP_PAGE_SIZE;
      const pageRows = list.slice(from, from + LAP_PAGE_SIZE);
      const head = st.headers.map(h => `<th class="px-3 py-2 text-left">${h}</th>`).join('');
      const rowsHtml = pageRows.length
        ? pageRows.map((r,i) => st.rowFn(r, from + i)).join('')
        : `<tr><td colspan="${st.headers.length}" class="px-3 py-6 text-center text-slate-500 italic text-[11px]">Tidak ada data.</td></tr>`;
      const pager = list.length > LAP_PAGE_SIZE ? `
        <div class="flex items-center justify-between px-3 py-2 text-[10px] text-slate-400 border-t border-white/5">
          <span>${from+1}-${Math.min(from+LAP_PAGE_SIZE, list.length)} dari ${list.length}</span>
          <div class="flex items-center gap-1.5">
            <button onclick="window.__lapPage('${id}',-1)" ${st.page<=1?'disabled':''} class="lap-pg-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="font-mono font-bold text-slate-300">${st.page}/${totalP}</span>
            <button onclick="window.__lapPage('${id}',1)" ${st.page>=totalP?'disabled':''} class="lap-pg-btn"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>` : '';
      body.innerHTML = `
        ${st.searchKeys.length ? `<div class="p-2"><input id="lapSearch_${id}" value="${st.q||''}" oninput="window['__lapSearch_${id}'](this.value)" placeholder="Cari di ${(st.title||id).toLowerCase()}..." class="w-full glass-inner rounded-lg px-3 py-1.5 text-xs text-slate-100"></div>` : ''}
        <div class="overflow-x-auto"><table class="w-full text-[11px] text-slate-300 font-mono min-w-[560px]">
          <thead class="bg-slate-900/60 text-slate-400 text-[9px] uppercase sticky top-0"><tr>${head}</tr></thead>
          <tbody>${rowsHtml}</tbody></table></div>${st.footer || ''}${pager}`;
      if (keepFocus) { const si = document.getElementById('lapSearch_' + id); if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); } }
      // Animasi baris HANYA saat tabel pertama kali dibuka — bukan tiap ketik
      // di search / ganti halaman (dulu bikin lag saat mengetik).
      if (pageRows.length && !st._revealed && !keepFocus) {
        st._revealed = true;
        FX.reveal(Array.from(body.querySelectorAll('tbody tr')).slice(0, 18), { y: 8, step: 12, duration: 300, scale: 1 });
      }
    }
    // dipanggil sesudah host.innerHTML dipasang: render body tiap tabel
    function lapTblMountAll() {
      Object.keys(lapTblState).forEach(id => { if (document.getElementById('lapTbl_' + id)) lapTblRepaint(id); });

    const td = (v, cls) => `<td class="px-3 py-1.5 ${cls||''}">${v==null?'':v}</td>`;

    // ---------- SETTING ----------
    function lapRenderSetting(host) {

    // Cloudflare di Mozart (limatogel.makintajir.com) memblokir SEMUA IP server

    // tempel skrip di DevTools Console tab Mozart (Console bypass CSP halaman).
    function lapMozartConsoleScript() {
      const panel = location.origin;
      const token = currentSessionToken || '';
      return "(async()=>{\n"
        + "  const O=location.origin, PANEL=" + JSON.stringify(panel) + ", TOKEN=" + JSON.stringify(token) + ";\n"
        + "  if(!/limatogel|makintajir|mozart/i.test(O)){alert('Buka skrip ini di TAB MOZART, bukan di sini.');return;}\n"
        + "  const p2=n=>('0'+n).slice(-2), td=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());\n"
        + "  const sd=prompt('Tanggal MULAI (YYYY-MM-DD)',td(new Date())); if(!sd)return;\n"
        + "  const ed=prompt('Tanggal AKHIR (YYYY-MM-DD)',sd); if(!ed)return;\n"
        + "  const FR=j=>{if(Array.isArray(j))return j;let b=[];for(const k in j){const v=j[k];if(Array.isArray(v)){if((v.length===0||typeof v[0]==='object')&&v.length>=b.length)b=v;}else if(v&&typeof v==='object'){const n=FR(v);if(n.length>b.length)b=n;}}return b;};\n"
        + "  const pull=async(path,bd)=>{const rows=[];for(let i=0;i<400;i++){const r=await fetch(O+path,{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({...bd,page_number:i,page_size:100})});if(!r.ok){if(i===0)throw new Error(path+' HTTP '+r.status);break;}const rr=FR(await r.json());rows.push(...rr);console.log(path,'hal',i,'(+'+rr.length+')');if(rr.length<100)break;}return rows;};\n"
        + "  const tryEP=async(m,path,body)=>{try{const o={method:m,credentials:'include',headers:{'content-type':'application/json'}};if(m==='POST')o.body=JSON.stringify(body||{});const r=await fetch(O+path,o);if(!r.ok)return null;const j=await r.json();return {path,data:j};}catch(e){return null;}};\n"
        + "  const seen=performance.getEntriesByType('resource').map(e=>e.name).filter(u=>u.indexOf(O)===0&&/bank|account|rekening|mbank|panel/i.test(u)).map(u=>u.slice(O.length).split('?')[0]);\n"
        + "  const accCand=['/api/bank/fetchBank','/api/bank-account/fetchBankAccount','/api/account/fetchAccount','/api/mbanking/fetchMbanking','/api/bank/fetch','/api/bank','/api/account'];\n"
        + "  const accountsRaw=[]; for(const p of [...new Set([...seen,...accCand])]){const g=await tryEP('POST',p,{})||await tryEP('GET',p); if(g&&g.data){accountsRaw.push(g); console.log('  meta ok:',p);}}\n"
        + "  const panelsRaw=[]; for(const p of ['/api/panel/fetchPanel','/api/panel/fetch','/api/panel','/api/panels','/api/panel/list']){const g=await tryEP('POST',p,{})||await tryEP('GET',p); if(g&&g.data){panelsRaw.push(g); console.log('  panel ok:',p);}}\n"
        + "  const findIds=v=>{const out=[];const w=x=>{if(Array.isArray(x)){x.forEach(w);return;}if(!x||typeof x!=='object')return;const id=x.id??x.ID??x.panel_id;const nm=x.name||x.panel_name||x.label||x.domain;if(id!=null&&nm)out.push({id:String(id),name:String(nm)});Object.values(x).forEach(w);};w(v);return out;};\n"
        + "  let panelList=[]; panelsRaw.forEach(pr=>panelList=panelList.concat(findIds(pr.data)));\n"
        + "  const uniq={}; panelList.forEach(p=>uniq[p.id]=p.name); panelList=Object.keys(uniq).map(id=>({id,name:uniq[id]}));\n"
        + "  console.log('%cPanel terdeteksi:','color:#ff0',panelList);\n"
        + "  const targets = panelList.length ? panelList.map(p=>p.id) : [0];\n"
        + "  let dep=[], wd=[];\n"
        + "  for(const pid of targets){\n"
        + "    console.log('%cMozart panel '+pid+': deposit...','color:#0ff');\n"
        + "    const d=await pull('/api/transactions/fetchTransaction',{panel_id:pid===0?0:Number(pid),start_date:sd,end_date:ed,not_done_filter:false,filter_by:null});\n"
        + "    d.forEach(r=>r._panelId=String(pid)); dep=dep.concat(d);\n"
        + "    console.log('%cMozart panel '+pid+': withdraw...','color:#0ff');\n"
        + "    const w=await pull('/api/wd/fetchWithdrawal',{panel_id:pid===0?0:Number(pid),start_date:sd,end_date:ed,filter_by:{minimum_amount:0}});\n"
        + "    w.forEach(r=>r._panelId=String(pid)); wd=wd.concat(w);\n"
        + "  }\n"
        + "  const x=await fetch(PANEL+'/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'lapMozartImport',token:TOKEN,startDate:sd,endDate:ed,depositRows:dep,withdrawRows:wd,accountsRaw:accountsRaw,panelsRaw:panelsRaw})});\n"
        + "  const jr=await x.json(); console.log(jr);\n"
        + "  alert(jr.success?('Mozart terkirim ke panel OK\\nDP '+jr.deposit+' / WD '+jr.withdraw+'\\n\\nBuka panel -> Lap Mozart -> Muat Ulang.'):('Gagal: '+(jr.message||'?')));\n"
        + "})();";
    }

    // Ringkasan per rekening bank: 1 baris = 1 rekening.
    // Kolom: REKENING BANK | KETERANGAN ("<prefix> <tgl> (N Transactions)") | NOMINAL
    function lapMozGroupTable(id, title, rows, prefix, meta) {
      const g = {};
      rows.forEach(r => {
        const k = (r.accName && String(r.accName).trim()) || (r.bank + ' ' + (r.accountNumber||'')).trim() || '(tanpa rekening)';
        (g[k] = g[k] || { name: k, count: 0, sum: 0 }).count++;
        g[k].sum += Number(r.amount || 0);
      });
      const list = Object.values(g).sort((a,b) => b.sum - a.sum);
      const grand = list.reduce((n,x) => n + x.sum, 0);
      const gc = list.reduce((n,x) => n + x.count, 0);
      const dl = lapMozRangeLabel(meta);
      const ket = c => `${prefix} ${dl} (${c} Transactions)`;
      return lapTable(id, ['REKENING BANK', 'KETERANGAN', 'NOMINAL'], list,
        r => `<tr>${td(r.name,'font-bold text-slate-200')}${td(ket(r.count),'text-slate-400 text-[10px]')}${td('Rp ' + lapFmt(r.sum),'text-right text-emerald-300 font-bold')}</tr>`,
        r => `${r.name} - ${ket(r.count)} - ${lapFmt(r.sum)}`,
        ['name'],
        { title, open: true, footer: lapMozFooter(prefix + ' ' + dl + ' — SEMUA REKENING', gc, grand) });
    }
    function lapMozRangeLabel(meta) {
      const at = (meta && meta.at) || '';
      const [a, b] = at.split('|');
      const f = s => { const p = String(s||'').split('-'); if (p.length !== 3) return s || '-';
        const bl = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
        return `${+p[2]} ${bl[+p[1]-1]||p[1]} ${p[0]}`; };
      if (!a) return '';
      return (!b || a === b) ? f(a) : f(a) + ' – ' + f(b);
    }

    function lapPollAdmin() {
      clearTimeout(lapAdminPollTimer);
      if (!lapAdminJobId) return;
      const prog = document.getElementById('lapAdminProgress');
      google.script.run.withSuccessHandler(res => {
        if (!res || !res.success) { lapBusy('lapAdmin', false, ''); if (prog) prog.textContent = (res && res.message) || 'Job hilang'; return; }
        if (prog) prog.textContent = ({pending:'⏳ Antre di GitHub Actions...', running:'⚙️ Scraping berjalan...', done:'✅ Selesai', error:'❌ '+res.message}[res.status]) || res.status;
        if (res.status === 'done') {
          lapBusy('lapAdmin', false, '');
          lapResults = res.results || lapResults;
          lapAdminJobId = null;
          renderLapPage('lap-admin');
          toast('Lap Admin selesai — ' + (lapResults.register||[]).length + ' akun register');
          return;

        if (res.status === 'error') { lapBusy('lapAdmin', false, ''); toast(res.message || 'Gagal'); lapAdminJobId = null; return; }
        lapAdminPollTimer = setTimeout(lapPollAdmin, 5000);

    const ADMIN_PANELS = ['dashboard','users','sites','sesi','autopost','backup','maintenance'];
    function switchAdminPanel(key, fromNav) {
      if (ADMIN_PANELS.indexOf(key) < 0) key = 'dashboard';
      currentAdminPanel = key;
      try { localStorage.setItem('daygroup_admin_tab', key); } catch (e) {}

      document.querySelectorAll('#admin-page .admin-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.adminTab === key));
      document.querySelectorAll('#admin-page .admin-panel').forEach(p =>
        p.classList.toggle('active', p.dataset.adminPanel === key));
      const sel = document.getElementById('adminTabSelect');
      if (sel && sel.value !== key) sel.value = key;

      // Muat data panel yang dibuka (pakai cache/freshness di masing-masing loader).
      if (key === 'dashboard') {
        if (pageDataCache.admin) applyDashboardData(pageDataCache.admin, 'admin', true);
        if (!pageDataCache.admin || Date.now() - pageFetchedAt.admin > NAV_FRESH_MS) loadDashboard(false, 'admin');
      } else if (key === 'users') {
        if (Date.now() - pageFetchedAt.users > NAV_FRESH_MS) { loadUsers(); pageFetchedAt.users = Date.now(); }
      } else if (key === 'sites') {
        if (!sitesData.length || Date.now() - (pageFetchedAt.sites||0) > NAV_FRESH_MS) { loadSites(); pageFetchedAt.sites = Date.now(); }
      } else if (key === 'sesi') {
        if (Date.now() - pageFetchedAt.sesi > NAV_FRESH_MS) { loadActiveSessions(); pageFetchedAt.sesi = Date.now(); }
      } else if (key === 'autopost') {
        loadAutoPostStatus();
      }
      if (!fromNav) pumpLivePoll(true);
    }

    function getPredictionRowUi(item, buttonBaseClass) {
      const sent = Number(item && item.sentCount || 0);

      let statusBadge = '';
      let sendLabel = 'SEND AUTO';
      let sendClass = buttonBaseClass || 'prediction-send-btn';
      let disabled = false;

      if (item && item.status === 'POSTED') {
        statusBadge = '<span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-extrabold">SELESAI</span>';
        sendLabel = 'SUDAH TERKIRIM';
        sendClass += ' done';
        disabled = false;
      } else if (item && item.status === 'PARTIAL') {
        statusBadge = `<span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-extrabold">${sent}/${total} TERKIRIM</span>`;
        sendLabel = 'KIRIM SISA';
        sendClass += ' partial';
      } else if (item && item.status === 'NO_ACCESS') {
        statusBadge = '<span class="px-3 py-1 rounded-full bg-slate-500/15 text-slate-400 border border-slate-500/20 text-[10px] font-extrabold">TIDAK ADA AKSES</span>';
        sendLabel = 'TERKUNCI';
        sendClass += ' locked';
        disabled = true;
      } else {
        statusBadge = '<span class="px-3 py-1 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/25 text-[10px] font-extrabold">BELUM DIKIRIM</span>';
      }

      const countText = total > 0
        ? `<span class="prediction-count">${sent} dari ${total} website ${item && item.kind === 'closing' ? 'pada sesi aktif' : 'hari ini'}</span>`
        : '';

      return { sent, total, statusBadge, sendLabel, sendClass, disabled, countText };
    }

    function getClosingSlotState(closing, slot) {
      const slots = Array.isArray(closing && closing.slots) ? closing.slots : [];
      return slots.find(item => String(item.slot) === String(slot)) || {
        slot: slot,
        status: 'ACTIVE',
        sentCount: 0,
        totalWebsites: Number(closing && closing.totalWebsites || 0),
        pendingCount: Number(closing && closing.totalWebsites || 0)
      };
    }

    function closingSlotStatusLabel(state) {
      if (!state || state.status === 'NO_ACCESS') return 'TIDAK ADA AKSES';
      if (state.status === 'POSTED') return 'SELESAI · ' + state.sentCount + '/' + state.totalWebsites;
      if (state.status === 'PARTIAL') return 'SEBAGIAN · ' + state.sentCount + '/' + state.totalWebsites;
      return 'BELUM DIKIRIM · 0/' + Number(state.totalWebsites || 0);
    }

    function selectClosingSlot(slot) {
      selectedClosingSlot = String(slot || '');
      activeClosingSlot = selectedClosingSlot;
      renderClosingPredictionCard(globalClosingPrediction);
    }

    function renderClosingPredictionCard(closing) {
      const card = document.getElementById('closingPredictionCard');
      if (!card) return;
      if (!closing) {
        card.style.display = 'block';
        card.innerHTML = '<div class="text-xs font-bold text-rose-200">Backend belum mengirim data kata-kata penutup. Gunakan code.gs Smart Lock V4.1 dan buat deployment versi baru.</div>';
        return;
      }

      const validSlots = Array.isArray(closing.slots) ? closing.slots.map(item => String(item.slot)) : ['06:15','16:00'];
      if (!selectedClosingSlot || !validSlots.includes(selectedClosingSlot)) {
        selectedClosingSlot = String(closing.activeSlot || '06:15');
      }
      activeClosingSlot = selectedClosingSlot;
      const selectedState = getClosingSlotState(closing, selectedClosingSlot);
      const selectedUi = getPredictionRowUi(Object.assign({kind:'closing'}, selectedState), 'closing-send-btn');
      const exampleText = String(closing.exampleText || 'Prediksi Togel Gacor HUGOTOGEL 04 August 2026\n\nPrediksi di atas hanyalah sekedar prediksi angka di hari ini. Tepat atau tidaknya tergantung hoki anda bosku');

      const slotButtons = ['06:15','16:00'].map(slot => {
        const state = getClosingSlotState(closing, slot);
        const selected = slot === selectedClosingSlot ? ' selected' : '';

          <span class="closing-slot-time">${slot}</span>
          <span class="closing-slot-state">${escapeHtml(closingSlotStatusLabel(state))}</span>

      card.innerHTML = `

    function sendClosingPredictionRow(websites, slotOverride) {
      const item = globalClosingPrediction;
      if (!item) return;

      activePredictionKind = 'closing';
      activePredictionIndex = -1;
      activeClosingSlot = slotOverride || selectedClosingSlot || item.activeSlot || '';
      const selectedWebsites = Array.isArray(websites) && websites.length ? websites : null;
      closePredictionSendModal();

      showActionPopup(
        'LOADING',
        selectedWebsites ? 'Mengirim Penutup yang Tertunda' : 'SEND AUTO Kata-Kata Penutup',
        selectedWebsites
          ? `Mengirim ulang ${selectedWebsites.length} website yang belum berhasil pada sesi ${activeClosingSlot}...`
          : `Sistem mengecek duplikat per website untuk sesi ${activeClosingSlot}, lalu mengirim tanpa konfirmasi...`,
        'fa-paper-plane'
      );

      google.script.run
        .withSuccessHandler(result => {
          closeActionPopup();
          if (!result) {
            showActionPopup('ERROR', 'Tidak Ada Respons', 'Server tidak mengembalikan hasil.', 'fa-triangle-exclamation');
            return;
          }
          if (result.blocked && (!result.websiteResults || !result.websiteResults.length)) {
            showActionPopup('ERROR', 'Pengiriman Diblokir', result.message || 'Pengiriman tidak dapat diproses.', 'fa-ban');
            return;
          }
          showPredictionSendResult(result);
          loadPredictionStatus();

    function showPredictionSendResult(result) {
      activePredictionKind = result && result.kind === 'closing' ? 'closing' : 'schedule';
      if (activePredictionKind === 'closing') {
        activePredictionIndex = -1;
        activeClosingSlot = String(result.activeSlot || activeClosingSlot || '');
      } else {
        activePredictionIndex = Number(result.predictionIndex);
        activeClosingSlot = '';
      }
      lastPredictionPendingWebsites = Array.isArray(result.pendingWebsites) ? result.pendingWebsites : [];
      const rows = Array.isArray(result.websiteResults) ? result.websiteResults : [];
      let success = 0;
      let already = 0;
      let failed = 0;
      let processing = 0;

      const cards = rows.map(item => {
        const status = String(item.status || 'GAGAL').toUpperCase();
        let statusClass = 'fail';
        let statusLabel = status;
        let icon = 'fa-triangle-exclamation';

        if (status === 'BERHASIL') {
          success++;
          statusClass = 'ok';
          statusLabel = 'TERKIRIM';
          icon = 'fa-circle-check';
        } else if (status === 'SUDAH DIKIRIM') {
          already++;
          statusClass = 'already';
          icon = 'fa-shield-halved';
        } else if (status === 'SEDANG DIPROSES') {
          processing++;
          statusClass = 'processing';
          icon = 'fa-spinner fa-spin';
        } else {
          failed++;
        }

        return `
          <div class="prediction-site-card">
            <div class="prediction-site-head">
              <div class="prediction-site-name"><i class="fa-brands fa-telegram mr-2 text-cyan-400"></i>${escapeHtml(item.website || '-')}</div>
              <span class="prediction-site-status ${statusClass}"><i class="fa-solid ${icon} mr-1"></i>${escapeHtml(statusLabel)}</span>
            </div>
            <div class="prediction-site-reason">${escapeHtml(item.reason || '-')}</div>
          </div>
        `;
      }).join('');

      document.getElementById('predictionSendList').innerHTML = cards || '<div class="text-xs text-slate-400">Tidak ada website yang diproses.</div>';
      document.getElementById('predictionResultTitle').textContent = result.predictionName || 'Hasil pengiriman prediksi';
      const predSummary = [];
      if (success) predSummary.push(`<span class="summary-pill status-ok">${success} terkirim</span>`);
      if (already) predSummary.push(`<span class="summary-pill status-skip">${already} diblokir duplikat</span>`);
      if (failed) predSummary.push(`<span class="summary-pill status-bad">${failed} belum terkirim</span>`);
      if (processing) predSummary.push(`<span class="summary-pill status-skip">${processing} diproses</span>`);
      if (!predSummary.length) predSummary.push(`<span class="summary-pill status-skip">Tidak ada yang diproses</span>`);
      if (result && result.performance) {
        const ms = Number(result.performance.totalMs || result.durationMs || 0);
        if (ms) predSummary.push(`<span class="summary-pill status-skip">⚡ ${(ms / 1000).toFixed(1)}s</span>`);

      retryBtn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i>KIRIM ${lastPredictionPendingWebsites.length} WEBSITE BELUM TERKIRIM`;

    /* ================= LIVE POLL ADAPTIF =================
       Pengganti WebSocket/SSE (tidak tersedia di Apps Script). Satu endpoint
       gabungan (getLivePanelData) dipoll dengan interval yang menyesuaikan:
         - tab tidak terlihat  -> berhenti total
         - user aktif          -> 15 dtk
         - idle 1.5-5 mnt       -> 30 dtk
         - idle > 5 mnt         -> 60 dtk
       Begitu tab kembali fokus / user pindah menu -> langsung sinkron 1x. */
    function markUserActive(){ lastUserActivityAt = Date.now(); }
    ['click','keydown','touchstart','mousemove','scroll'].forEach(ev =>
      document.addEventListener(ev, markUserActive, { passive:true }));

    function livePollDelayMs(){
      // Overlay maintenance sedang tampil -> cek lebih sering (10 dtk) supaya panel
      // langsung terbuka begitu admin mematikan maintenance, walau tab di belakang.
      if (maintenanceState && document.getElementById('maintenanceModal').classList.contains('open')) {
        return document.hidden ? 20000 : 10000;
      }
      // Tab tidak terlihat: TIDAK berhenti total, hanya melambat ke 2 menit supaya
      // data tetap "hangat" tanpa boros kuota. Begitu tab dibuka lagi -> sinkron 1x instan.
      if (document.hidden) return 180000;
      if (livePollFailStreak >= 4) return 90000; // endpoint bermasalah -> jangan spam
      const idle = Date.now() - lastUserActivityAt;
      // Halaman Aktivitas / Dashboard admin butuh refresh log lebih sering.
      // Halaman lain (Result/Prediksi/Invest/Lap) cuma perlu status header -> lebih lambat,
      // hemat request Worker & baca D1 (16 CS x poll cepat = dekat limit 100k req/hari).
      const onLog = currentPage === 'activity' || (currentPage === 'admin' && currentAdminPanel === 'dashboard');
      if (idle > 300000) return onLog ? 75000 : 150000;
      if (idle > 90000)  return onLog ? 45000 : 90000;
      return onLog ? 20000 : 45000;
    }

    function scheduleLivePoll(){
      clearTimeout(livePollTimer);
      livePollTimer = setTimeout(() => pumpLivePoll(false), livePollDelayMs());
    }

    function activityFiltersActive(mode){
      const dirty = ['Search','UserFilter','ActionFilter','StatusFilter','DateFrom','DateTo'].some(s => {
        const el = document.getElementById(activityId(mode, s));
        return el && String(el.value || '').trim();
      });
      const src = document.getElementById(activityId(mode, 'SourceFilter'));
      return dirty || (src && src.value && src.value !== 'ALL');
    }

    function pumpLivePoll(immediate){
      if (!currentUser) return;
      if (document.hidden && !immediate) { scheduleLivePoll(); return; }
      // Watchdog: kalau permintaan sebelumnya "nyangkut" > 35 dtk, anggap gagal
      // supaya rantai polling tidak pernah macet permanen.
      if (livePollInFlight) {
        if (Date.now() - livePollStartedAt < 35000) return;
        livePollInFlight = false;
      }
      livePollStartedAt = Date.now();

      const adminDash = currentPage === 'admin' && currentAdminPanel === 'dashboard';
      const onLogPage = currentPage === 'activity' || adminDash;
      const mode = currentPage === 'admin' ? 'admin' : 'activity';
      const wantActivity = onLogPage
        && activityViews[mode].page === 1
        && !activityFiltersActive(mode);
      const wantSessions = currentPage === 'admin' && currentAdminPanel === 'sesi';
      const req = wantActivity ? getActivityRequest(mode) : null;

      livePollInFlight = true;
      google.script.run
        .withSuccessHandler(res => {
          livePollInFlight = false;
          livePollFailStreak = 0;
          // Status maintenance ikut tiap poll -> overlay member muncul/hilang otomatis.
          if (res && res.maintenance) {
            setMaintenanceLock(res.maintenance.enabled, res.maintenance.message);
          } else if (res && res.success === false
                     && /maintenance|pemeliharaan|perbaikan|maintening/i.test(res.message || '')) {
            // Cadangan untuk server LAMA: getLivePanelData menolak non-admin saat
            // maintenance dengan melempar pesannya -> tampilkan overlay dari pesan itu.
            setMaintenanceLock(true, res.message);
          }
          if (res && res.success) {
            if (res.summary) {
              renderHeaderSummary(document.getElementById('headerSummary'), res.summary);
              headerSummaryLoadedOnce = true;
            }
            if (res.activity && wantActivity && res.activity.stats && Array.isArray(res.activity.rows)) {
              applyDashboardData(res.activity, mode, true);
            }
            if (res.sessions && wantSessions) renderActiveSessions(res.sessions);
          }
          scheduleLivePoll();
        })
        .withFailureHandler(() => {
          livePollInFlight = false;
          livePollFailStreak++;
          // Endpoint gabungan mungkin belum ter-deploy -> pakai jalur lama.
          if (livePollFailStreak >= 2) {
            if (!headerSummaryLoadedOnce || livePollFailStreak === 2) loadHeaderSummary();
            if (currentPage === 'admin' && currentAdminPanel === 'sesi') loadActiveSessions();
          }
          scheduleLivePoll();
        })
        .getLivePanelData(currentSessionToken, { activity: req, sessions: wantSessions });
    }

    function startLivePolling(){
      livePollFailStreak = 0;
      pumpLivePoll(true);
    }

    let toastHideTimer = null;
    function toast(message) {
      const text = String(message || '').replace(/^[^\wÀ-ÿ]+/u, '').trim();
      const lower = text.toLowerCase();
      const type =
        lower.includes('gagal') || lower.includes('error') || lower.includes('❌')
          ? 'danger'
          : lower.includes('berhasil') || lower.includes('disalin') || lower.includes('selamat')
            ? 'success'
            : lower.includes('peringatan') || lower.includes('diblokir')
              ? 'warning'
              : 'info';
      const iconMap = { success:'fa-circle-check', danger:'fa-circle-xmark', warning:'fa-triangle-exclamation', info:'fa-circle-info' };

      const box = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const msg = document.getElementById('toast-msg');
      if (!box || !msg) return;

      box.className = `floating-toast type-${type}`;
      if (icon) icon.innerHTML = `<i class="fa-solid ${iconMap[type]}"></i>`;
      msg.textContent = text;

      // Reflow paksa (SINKRON, bukan requestAnimationFrame) supaya animasi "show" jalan
      // lagi meski toast sebelumnya belum sempat hilang. requestAnimationFrame menunda
      // penambahan class "show" ke frame berikutnya -- kalau hideToast() (dipanggil
      // switchPage() tiap pindah menu) kebetulan jalan di jeda itu, timer auto-hide yang
      // baru saja dijadwalkan di bawah ini sudah kadung dibatalkan duluan, lalu "show"
      // baru ditambahkan belakangan tanpa ada timer yang akan menghapusnya lagi -> toast
      // nyangkut permanen sampai reload. Reflow paksa lewat offsetWidth tidak punya jeda
      // async sama sekali, jadi race ini tidak mungkin terjadi lagi.
      void box.offsetWidth;
      box.classList.add('show');

      clearTimeout(toastHideTimer);
      toastHideTimer = setTimeout(() => box.classList.remove('show'), 2600);
    }
    function hideToast() {
      clearTimeout(toastHideTimer);
      const b = document.getElementById('toast');
      if (b) b.classList.remove('show');
    }

    function getShioLocal(num) {
      const groups = ["KELINCI","KUDA","ULAR","NAGA","KELINCI","HARIMAU","KERBAU","TIKUS","BABI","ANJING","AYAM","MONYET","KAMBING"];
      const value = Number(num);
      if (value === 0) return 'KELINCI';
      const normalized = ((value % 12) + 12) % 12;
      return normalized === 0 ? 'KAMBING' : groups[normalized];
    }

    function processTextLocal(text) {
      try {
        if (!text || text.length < 5) return { market:'UNKNOWN', status:'SALAH', shio:'', twoDigit:'', output:'', prize1:'', prize2:'', prize3:'' };
        const marketMatch = text.match(/Pasaran\s+(.*)/i);
        const market = marketMatch ? marketMatch[1].trim() : 'UNKNOWN';
        const prize1 = ((text.match(/Prize\s*1[^0-9]*(\d{4})/i) || [])[1] || '');
        if (!prize1) return { market, status:'SALAH', shio:'', twoDigit:'', output:'', prize1:'', prize2:'', prize3:'' };
        const prize2 = ((text.match(/Prize\s*2[^0-9]*(\d{4})/i) || [])[1] || '');
        const prize3 = ((text.match(/Prize\s*3[^0-9]*(\d{4})/i) || [])[1] || '');
        const twoDigit = Number(prize1.slice(-2));
        const shio = getShioLocal(twoDigit);
        const shioInput = ((text.match(/Shio\s*:\s*([A-Z]+)/i) || [])[1] || '').toUpperCase();
        const status = shioInput ? (shioInput === shio ? 'BENAR' : 'SALAH') : 'BENAR';
        let output = text.trim();
        output = output.replace(/Prize\s*1\s*:/gi, 'Prize 1️⃣ :').replace(/Prize\s*2\s*:/gi, 'Prize 2️⃣ :').replace(/Prize\s*3\s*:/gi, 'Prize 3️⃣ :');
        if (/Shio\s*:/i.test(output)) output = output.replace(/Shio\s*:.*$/im, 'Shio : ' + shio);
        else output += '\n\nShio : ' + shio;
        output = output.replace(/Selamat kepada para pemenang jackpot\s*\.?/i, 'Selamat kepada para pemenang jackpot 🙏🏻');
        return { market, status, shio, twoDigit, output, prize1, prize2, prize3 };
      } catch (_) {
        return { market:'UNKNOWN', status:'SALAH', shio:'', twoDigit:'', output:'', prize1:'', prize2:'', prize3:'' };
      }
    }

    /* Tombol "Tempel": ambil isi clipboard lalu masukkan ke input.
       - textarea: ganti seluruh isi + jalankan autoGenerate (preview langsung terisi).
       - angka: ambil 4 digit pertama yang ketemu kalau ada, kalau tidak pakai apa adanya. */
    async function pasteFromClipboard(targetId, isTextarea) {
      const el = document.getElementById(targetId);
      if (!el) return;
      let text = '';
      try {
        text = await navigator.clipboard.readText();
      } catch (e) {
        toast('❌ Browser menolak akses clipboard. Tekan lama lalu pilih Tempel, atau Ctrl+V manual.');
        el.focus();
        return;
      }
      text = String(text || '').trim();
      if (!text) { toast('Clipboard kosong'); return; }

      if (isTextarea) {
        el.value = text;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        autoGenerate();
        toast('📋 Teks berhasil ditempel');
      } else {
        const digits = (text.match(/\d{4,}/) || [text.replace(/\D/g, '')])[0] || '';
        el.value = digits.slice(0, 12);
        el.dispatchEvent(new Event('input', { bubbles: true }));
        toast(el.value ? '📋 Angka ditempel: ' + el.value : 'Tidak ada angka di clipboard');
      }
      el.focus();
    }
