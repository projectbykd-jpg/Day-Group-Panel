    const SEND_FLY_MS = 560;
    // Popup loading sengaja DITUNDA sampai seluruh animasi ini selesai, supaya popup
    // (yang menutupi seluruh kartu) tidak langsung menimpa animasi tombol.
    const SEND_PLANE_DURATION_MS = SEND_FOLD_MS + SEND_FLY_MS;

    function dgPrefersReducedMotion_() {
      try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
      catch (e) { return false; }
    }

    // Dijalankan lewat Web Animations API (element.animate()), BUKAN class+CSS.
    // Tombol ini juga punya `active:scale-95` (Tailwind) dan efek tekan universal
    // (button:active{transform:scale(.965)}) yang rebutan properti `transform` yang
    // sama di saat bersamaan dengan animasi lipat — itu sumber "patah-patah"
    // sebelumnya. WAAPI selalu menang atas transisi CSS manapun untuk properti yang
    // sama, jadi tidak ada lagi rebutan, hasilnya mulus di semua kondisi.
    // Return value: {animated:boolean, landing:{x,y}|null}. `landing` = titik tujuan
    // pesawat DI LAYAR (viewport) — dipakai showActionPopup supaya popup Loading
    // terasa "terbuka" dari titik itu.
    //
    // Lintasannya dihitung MANUAL (kurva Bezier kuadratik di JS -> daftar titik ->
    // dijadikan keyframe transform:translate biasa). Sebelumnya sempat memakai CSS
    // Motion Path (offset-path), tapi ternyata perilakunya TIDAK bisa diandalkan
    // untuk elemen position:fixed di berbagai browser (arah lintasan jadi salah,
    // pesawat "hilang" di tempat yang tidak terduga). Pendekatan manual ini 100%
    // dikontrol sendiri (matematika translate biasa, sudah terbukti benar).
    function launchSendPlane(btnEl) {
      if (!btnEl || typeof btnEl.animate !== 'function' || dgPrefersReducedMotion_()) {
        return { animated: false, landing: null };
      }

      // Titik tengah tombol DI LAYAR. Karena scale() melipat tombol di sekitar
      // titik tengahnya sendiri, titik ini TIDAK berpindah selama animasi lipat.
      const btnRect = btnEl.getBoundingClientRect();
      const startX = btnRect.left + btnRect.width / 2;
      const startY = btnRect.top + btnRect.height / 2;

      // Tujuan pesawat = TITIK TENGAH LAYAR — di situlah popup Loading akan tampil
      // (#actionPopup ditengahkan lewat flexbox), supaya pesawat benar-benar
      // "terbang menuju tempat popup akan berada", lalu titik itu membuka popupnya.
      const targetX = window.innerWidth / 2;
      const targetY = window.innerHeight / 2;
      const landing = { x: targetX, y: targetY };

      // Vektor start->target, dan titik kontrol kurva digeser TEGAK LURUS terhadap
      // garis lurus itu supaya lintasannya sungguhan melengkung (bukan diagonal lurus).
      const dx = targetX - startX;
      const dy = targetY - startY;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const perpX = -dy / dist;
      const perpY = dx / dist;
      const bulge = Math.min(220, dist * 0.4);
      const controlX = dx / 2 + perpX * bulge;
      const controlY = dy / 2 + perpY * bulge;

      // Titik pada kurva Bezier kuadratik P0=(0,0) P1=control P2=(dx,dy), t di [0,1].
      // Semua koordinat RELATIF terhadap titik start (startX,startY).
      function bezierPoint(t) {
        const mt = 1 - t;
        return {
          x: 2 * mt * t * controlX + t * t * dx,
          y: 2 * mt * t * controlY + t * t * dy
        };
      }

      // Sudut arah gerak SESAAT di titik t (turunan kurva, dihitung numerik via selisih
      // titik sedikit sebelum & sesudah t) -> dipakai supaya moncong pesawat betulan
      // menghadap ke arah dia terbang di titik manapun, bukan angka rotasi tetap yang
      // tidak nyambung kalau tombolnya ada di posisi berbeda di layar.
      function curveTangentDeg(t) {
        const ahead = bezierPoint(Math.min(1, t + .03));
        const behind = bezierPoint(Math.max(0, t - .03));
        return Math.atan2(ahead.y - behind.y, ahead.x - behind.x) * 180 / Math.PI;
      }
      // Ikon fa-paper-plane menghadap timur-laut (kanan-atas, ~-45°) saat rotate(0deg)
      // di CSS -> offset ini menyamakan "arah hadap" ikon dengan arah tangen kurva.
      const PLANE_ICON_ANGLE_OFFSET = 45;

      const startRadius = getComputedStyle(btnEl).borderRadius || '16px';

      btnEl.style.willChange = 'transform';
      const runningAnimations = [];

      // Tahap 1 — lipat: tombol diperas jadi kapsul kecil.
      runningAnimations.push(btnEl.animate([
        { transform: 'scale(1,1) rotate(0deg)', borderRadius: startRadius },
        { transform: 'scale(.16,.56) rotate(-3deg)', borderRadius: '999px' }
      ], { duration: SEND_FOLD_MS, easing: 'cubic-bezier(.55,0,.85,.05)', fill: 'forwards' }));

      // Teks/ikon asli fade out bersamaan dengan lipatan.
      ['.btn-send-icon', '.btn-send-label', '.btn-send-suffix'].forEach(function (sel) {
        const el = btnEl.querySelector(sel);
        if (el) runningAnimations.push(el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' }));
      });

      // Setelah lipatan selesai -> kembalikan tombol ke gaya CSS aslinya (cancel()
      // menghapus efek WAAPI) dan buang elemen pesawat/jejak.
      const restore = function () {
        runningAnimations.forEach(function (a) { try { a.cancel(); } catch (e) {} });
        btnEl.style.willChange = '';
      };

      // Titik sampel di sepanjang kurva + nilai opacity/scale/rotate pesawat di tiap
      // titik itu (t=0 di tombol, t=1 di tengah layar / titik popup).
      const PLANE_KEYS = [
        { t: 0,    op: 0,  sc: .3 },
        { t: .15,  op: 1,  sc: 1.3 },
        { t: .35,  op: 1,  sc: .95 },
        { t: .55,  op: 1,  sc: .65 },
        { t: .78,  op: 1,  sc: .45 },
        { t: .93,  op: .5, sc: .35 },
        { t: 1,    op: 0,  sc: .3 }
      ];
      const TRAIL_KEYS = [
        { t: 0,   op: 0,  sx: .1 },
        { t: .12, op: .9, sx: .35 },
        { t: .3,  op: .85, sx: .7 },
        { t: .5,  op: .6, sx: 1 },
        { t: .68, op: .3, sx: 1 },
        { t: .8,  op: 0,  sx: 1 }
      ];

      const launchPlane = function () {
        // Tahap 2 — pesawat besar lepas landas dari titik tengah kapsul. Ditaruh di
        // document.body (position:fixed) supaya ukurannya tetap proporsional, tidak
        // ikut kegepeng oleh transform scale non-seragam tombol.
        const trail = document.createElement('span');
        trail.className = 'send-launch-trail';
        trail.style.left = startX + 'px';
        trail.style.top = startY + 'px';
        document.body.appendChild(trail);

        const plane = document.createElement('i');
        plane.className = 'fa-solid fa-paper-plane send-launch-plane';
        plane.style.left = startX + 'px';
        plane.style.top = startY + 'px';
        document.body.appendChild(plane);

        const planeFrames = PLANE_KEYS.map(function (k) {
          const pt = bezierPoint(k.t);
          const rot = curveTangentDeg(k.t) + PLANE_ICON_ANGLE_OFFSET;
          return {
            transform: 'translate(calc(-50% + ' + Math.round(pt.x) + 'px), calc(-50% + ' + Math.round(pt.y) + 'px)) scale(' + k.sc + ') rotate(' + rot.toFixed(1) + 'deg)',
            opacity: k.op,
            offset: k.t
          };
        });
        plane.animate(planeFrames, { duration: SEND_FLY_MS, easing: 'linear', fill: 'forwards' });

        // Jejak: sudutnya dihitung dari arah gerak sesaat (titik sedikit di depan
        // pada kurva yang sama) supaya tampak seperti ekor asap mengikuti lengkungan.
        const trailFrames = TRAIL_KEYS.map(function (k) {
          const pt = bezierPoint(k.t);
          const ahead = bezierPoint(Math.min(1, k.t + .04));
          const angle = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI;
          return {
            transform: 'translate(calc(-50% + ' + Math.round(pt.x) + 'px), calc(-50% + ' + Math.round(pt.y) + 'px)) rotate(' + angle.toFixed(1) + 'deg) scaleX(' + k.sx + ')',
            opacity: k.op,
            offset: k.t
          };
        });
        trail.animate(trailFrames, { duration: SEND_FLY_MS, easing: 'linear', fill: 'forwards' });

        setTimeout(function () {
          plane.remove();
          trail.remove();
          restore();
        }, SEND_FLY_MS);
      };

      runningAnimations[0].finished.then(launchPlane, launchPlane);
      return { animated: true, landing: landing };
    }

    // Kedip hijau "✓ TERKIRIM" sesaat pada tombol saat pengiriman sukses.
    function flashSendSuccess(btnEl) {
      if (!btnEl) return;
      const icon = btnEl.querySelector('.btn-send-icon');
      const label = btnEl.querySelector('.btn-send-label');
      if (!icon || !label) return;
      const prevIconClass = icon.className;
      const prevLabelText = label.textContent;
      btnEl.classList.add('is-sent');
      icon.className = 'fa-solid fa-check btn-send-icon';
      label.textContent = 'TERKIRIM';
      setTimeout(() => {
        btnEl.classList.remove('is-sent');
        icon.className = prevIconClass;
        label.textContent = prevLabelText;
      }, 1400);
    }

    // =========================================================
    // FAST AUTO SEND
    // Satu klik = satu panggilan server.
    // Backend membaca Users, Sosmed, dan Sent Registry sekali,
    // melewati duplikat, lalu langsung mengirim website yang belum.
    // =========================================================
    function triggerAutoSend(btnEl) {
      const txt = document.getElementById('inputText').value.trim();
      if (!txt) {
        toast('❌ Input Data Kosong!');
        return;
      }

      const btn = btnEl || document.getElementById('autoSendBtn');
      const launch = launchSendPlane(btn);

      // Popup loading (menutupi seluruh kartu) sengaja ditunda sampai animasi
      // pesawat selesai terbang, supaya animasinya tidak langsung ketutupan.
      // Kalau animasi di-skip (mis. prefers-reduced-motion), jangan ikut menunda.
      if (launch.animated) setTimeout(() => dispatchAutoSend(txt, btn, launch.landing), SEND_PLANE_DURATION_MS);
      else dispatchAutoSend(txt, btn, null);
    }

    function dispatchAutoSend(txt, btn, landingPoint) {
      pendingSendText = txt;
      // landingPoint (titik pesawat mendarat di layar) dipakai supaya popup Loading
      // terasa "membuka" dari situ, bukan muncul begitu saja di tengah layar.
      showActionPopup(
        'LOADING',
        'Auto Send Berjalan',
        'Memeriksa izin, melewati duplikat, dan mengirim website yang belum...',
        'fa-paper-plane',
        landingPoint
      );

      google.script.run
        .withSuccessHandler(result => {
          closeActionPopup();

          if (!result) {
            showActionPopup(
              'ERROR',
              'Tidak Ada Respons',
              'Server tidak mengembalikan hasil pengiriman.',
              'fa-triangle-exclamation'
            );
            return;
          }

          if (result.blocked && (!result.websiteResults || !result.websiteResults.length)) {
            showActionPopup(
              'ERROR',
              'Pengiriman Diblokir',
              result.message || 'Pengiriman tidak dapat diproses.',
              'fa-ban'
            );
            return;
          }

          // Hasil selalu ditampilkan, termasuk website duplikat,
          // tidak diizinkan, gagal, dan berhasil.
          if (result.success || result.partial) flashSendSuccess(btn);
          pendingPreview = null;
          showSendResult(result);
        })
        .withFailureHandler(err => {
          showActionPopup(
            'ERROR',
            'Pengiriman Gagal',
            (err && err.message) || 'Terjadi kesalahan saat menghubungi server.',
            'fa-triangle-exclamation'
          );
        })
        .smartAutoSendFast(txt, currentSessionToken);
    }

    // Modal konfirmasi lama dipertahankan agar fungsi lain tidak error,
    // tetapi Auto Send cepat tidak memakainya.
    function closeSendConfirm() {
      document.getElementById('sendConfirmModal').classList.remove('open');
    }

    function confirmSendNow() {
      closeSendConfirm();
      triggerAutoSend();
    }

    function showSendResult(result) {
      lastSendResult = result;

      const labels = { telegram: 'Telegram', linktree: 'LinkTree', panelz: 'Panel-Z' };
      const icons = { telegram: 'fa-brands fa-telegram', linktree: 'fa-solid fa-link', panelz: 'fa-solid fa-bolt' };
      const sysKeys = Object.keys(labels);
      const esc = escapeHtml;
      const safe = s => String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      const websiteResults = Array.isArray(result.websiteResults) ? result.websiteResults : [];

      let success = 0, failed = 0, blocked = 0, already = 0;
      const okSites = [], dupSites = [], problemSites = [];

      websiteResults.forEach(site => {
        const vals = sysKeys.map(k => String((site[k] || {}).status || '').toUpperCase());
        vals.forEach(s => {
          if (s === 'BERHASIL') success++;
          else if (s === 'GAGAL') failed++;
          else if (s === 'DIBLOKIR') blocked++;
          else if (s === 'SUDAH DIKIRIM') already++;
        });
        const hasBad = vals.includes('GAGAL') || vals.includes('DIBLOKIR');
        if (hasBad) problemSites.push(site);
        else if (vals.includes('BERHASIL')) okSites.push(site);
        else dupSites.push(site);
      });

      // Kasus umum (semua lancar / semua duplikat) -> cukup toast, tanpa modal.
      if (!problemSites.length) {
        const nOk = okSites.length, nDup = dupSites.length;
        if (nOk && nDup) toast(`Berhasil ${nOk} website, ${nDup} sudah dikirim (dilewati)`);
        else if (nOk) toast(`Berhasil dikirim ke ${nOk} website`);
        else if (nDup) toast(`${nDup} website sudah pernah dikirim — tidak dikirim ulang`);
        else toast('Tidak ada website yang diproses');
        return;
      }

      // Ada yang gagal/diblokir -> modal ringkas, fokus ke yang bermasalah.
      const problemCards = problemSites.map(site => {
        const okChips = sysKeys
          .filter(k => String((site[k] || {}).status || '').toUpperCase() === 'BERHASIL')
          .map(k => `<span class="mini-chip status-ok">✓ ${labels[k]}</span>`).join('');

        const badRows = sysKeys.map(k => {
          const it = site[k] || {};
          const s = String(it.status || '').toUpperCase();
          if (s !== 'GAGAL' && s !== 'DIBLOKIR') return '';
          const canRetry = s === 'GAGAL' && !/tidak diizinkan/i.test(String(it.reason || ''));
          const retry = canRetry
            ? `<button onclick="retryOneSystem('${k}','${safe(site.website)}')" class="retry-mini"><i class="fa-solid fa-rotate-right mr-1"></i>COBA ULANG</button>`
            : '';
          return `<div class="system-compact">
              <div class="system-compact-top">
                <span class="system-compact-name"><i class="${icons[k]} mr-1.5 text-slate-400"></i>${labels[k]}</span>
                <span class="system-compact-status status-bad">${esc(s)}</span>
              </div>
              <div class="system-compact-reason">${esc(it.reason || '-')}</div>
              ${retry}
            </div>`;
        }).join('');

        return `<div class="website-result-card">
            <div class="website-result-head">
              <b class="text-sm text-cyan-300">${esc(site.website || '-')}</b>
              <span class="text-[9px] text-rose-300">PERLU DICEK</span>
            </div>
            ${okChips ? `<div class="mini-chip-row">${okChips}</div>` : ''}
            <div class="grid gap-2">${badRows}</div>
          </div>`;
      }).join('');

      const flatLine = (site, kind) => {
        const cls = kind === 'ok' ? 'status-ok' : 'status-skip';
        const txt = kind === 'ok' ? '✓ Terkirim' : '⊘ Sudah dikirim';
        return `<div class="result-flat-line"><span class="text-slate-300">${esc(site.website || '-')}</span><span class="${cls}">${txt}</span></div>`;
      };
      const restBlock = (okSites.length || dupSites.length)
        ? `<div class="result-flat-wrap">${okSites.map(s => flatLine(s, 'ok')).join('')}${dupSites.map(s => flatLine(s, 'dup')).join('')}</div>`
        : '';

      document.getElementById('systemResultList').innerHTML = problemCards + restBlock;

      const summaryParts = [];
      if (success) summaryParts.push(`<span class="summary-pill status-ok">${success} berhasil</span>`);
      if (failed) summaryParts.push(`<span class="summary-pill status-bad">${failed} gagal</span>`);
      if (blocked) summaryParts.push(`<span class="summary-pill status-bad">${blocked} tidak diizinkan</span>`);
      if (already) summaryParts.push(`<span class="summary-pill status-skip">${already} sudah dikirim</span>`);
      document.getElementById('resultSummary').innerHTML = summaryParts.join('');

      const titleEl = document.querySelector('#sendResultModal h3');
      if (titleEl) titleEl.textContent = `${problemSites.length} website perlu dicek`;

      document.getElementById('sendResultModal').classList.add('open');
    }

    function retryOneSystem(systemName, website) {
      document.getElementById('sendResultModal').classList.remove('open');

      showActionPopup(
        'LOADING',
        'Mencoba Ulang',
        `Mengirim ulang ${systemName} hanya ke ${website}...`,
        'fa-rotate'
      );

      google.script.run
        .withSuccessHandler(result => {
          closeActionPopup();
          showSendResult(result);
        })
        .withFailureHandler(err => {
          showActionPopup(
            'ERROR',
            'Retry Gagal',
            (err && err.message) || 'Gagal mencoba ulang.',
            'fa-triangle-exclamation'
          );
        })
        .retryFailedSystem(pendingSendText, currentSessionToken, systemName, website);
    }

    // Popup loading yang lebih rapi, responsif, dan mendukung status error.
    // originPoint {x,y} (opsional, koordinat viewport) — kalau diisi DAN mode
    // 'LOADING', kartu popup "terbuka" dari titik itu (dipakai Auto Send: titik
    // pesawat mendarat) alih-alih animasi bawaan (popupIn) yang selalu dari tengah.
    let popupStepTimer;
    function showActionPopup(mode, title, desc, iconClass, originPoint) {
      const popup = document.getElementById('actionPopup');
      const card = popup.querySelector('.popup-card');
      const spinner = document.getElementById('popupSpinner');
      const checkIcon = document.getElementById('popupCheckIcon');
      const mainIcon = document.getElementById('popupMainIcon');
      const popupTitle = document.getElementById('popupTitle');
      const popupDesc = document.getElementById('popupDesc');
      const eyebrow = document.getElementById('popupEyebrow');
      const closeBtn = document.getElementById('popupCloseBtn');
      const iconBox = document.getElementById('popupIconBox');
      const glow = document.getElementById('popupGlow');
      const progressWrap = document.getElementById('popupProgressWrap');
      const progressBar = document.getElementById('popupProgressBar');
      const steps = [...document.querySelectorAll('#popupSteps .popup-step')];

      clearTimeout(popupStepTimer);

      // Bersihkan dulu sisa animasi "buka dari titik X" dari panggilan SEBELUMNYA
      // (kartu popup ini dipakai bersama oleh SEMUA aksi di panel, bukan cuma Auto
      // Send) -> supaya panggilan lain yang tidak mengirim originPoint tetap dapat
      // animasi bawaan (popupIn) seperti biasa, bukan ikut ketiban override lama.
      if (card) {
        try { card.getAnimations().forEach(a => a.cancel()); } catch (e) {}
        card.style.animation = '';
        card.style.clipPath = '';
        card.style.webkitClipPath = '';
      }

      popup.classList.add('is-open');
      popup.style.display = 'flex';
      document.body.classList.add('modal-open');
      popupTitle.textContent = title;
      popupDesc.textContent = desc;

      if (mode === 'LOADING' && originPoint && card && typeof card.animate === 'function') {
        // Kartu sudah ke-layout (display:flex barusan) -> getBoundingClientRect aman dibaca.
        const cardRect = card.getBoundingClientRect();
        const originX = originPoint.x - cardRect.left;
        const originY = originPoint.y - cardRect.top;

        // Efek "buka dari titik X" dipakai lewat clip-path (lingkaran membesar),
        // BUKAN transform:scale() seperti sebelumnya. Alasannya: kartu ini punya
        // #popupGlow di dalamnya dengan filter:blur(72px) — karena elemen itu ANAK
        // dari kartu, dia ikut ter-skala tiap kali kartu di-scale(), dan blur
        // sebesar itu dihitung ulang tiap frame -> itulah sumber "kedip-kedip"
        // sebenarnya (bukan cuma backdrop-filter seperti dugaan sebelumnya).
        // clip-path TIDAK mengubah ukuran kotak elemen sama sekali — cuma area
        // yang TERLIHAT yang membesar — jadi tidak ada blur yang perlu dihitung
        // ulang sama sekali, kedipannya hilang total di akarnya.
        const corners = [
          [0, 0], [cardRect.width, 0], [0, cardRect.height], [cardRect.width, cardRect.height]
        ];
        const maxRadius = Math.ceil(Math.max.apply(null, corners.map(function (c) {
          return Math.hypot(c[0] - originX, c[1] - originY);
        })));

        card.style.animation = 'none'; // matikan animasi CSS popupIn bawaan untuk kartu ini
        const openAnim = card.animate([
          { clipPath: 'circle(0px at ' + originX + 'px ' + originY + 'px)', opacity: .55 },
          { clipPath: 'circle(' + maxRadius + 'px at ' + originX + 'px ' + originY + 'px)', opacity: 1 }
        ], { duration: 420, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
        openAnim.finished.then(() => {
          try { openAnim.cancel(); } catch (e) {}
          card.style.animation = '';
          card.style.clipPath = '';
          card.style.webkitClipPath = '';
        }, () => {});
      }

      if (mode === 'LOADING') {
        eyebrow.textContent = 'SYSTEM PROCESS';
        eyebrow.className = 'text-[9px] font-extrabold tracking-[.25em] text-cyan-400 uppercase';
        spinner.style.display = 'block';
        checkIcon.style.display = 'none';
        mainIcon.style.display = 'block';
        mainIcon.className = `fas ${iconClass || 'fa-paper-plane'} text-xl text-cyan-200`;
        closeBtn.style.display = 'none';
        progressWrap.style.display = 'flex';
        progressBar.className = 'progress-bar is-loading';
        iconBox.className = 'w-20 h-20 rounded-[1.6rem] bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center shadow-[0_0_35px_rgba(34,211,238,.16)] relative';
        glow.className = 'absolute -top-20 left-1/2 -translate-x-1/2 w-56 h-56 bg-cyan-500/20 blur-[72px] rounded-full pointer-events-none';
        steps.forEach((el, i) => {
          el.className = 'popup-step' + (i === 0 ? ' active' : '');
          el.lastElementChild.outerHTML = i === 0 ? '<i class="fa-solid fa-spinner fa-spin"></i>' : '<span>Menunggu</span>';
        });
        popupStepTimer = setTimeout(() => {
          if (!popup.classList.contains('is-open')) return;
          steps[0].className = 'popup-step done'; steps[0].lastElementChild.outerHTML = '<i class="fa-solid fa-check"></i>';
          steps[1].className = 'popup-step active'; steps[1].lastElementChild.outerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        }, 700);
      } else {
        const isError = mode === 'ERROR';
        eyebrow.textContent = isError ? 'PROCESS FAILED' : 'PROCESS COMPLETED';
        eyebrow.className = `text-[9px] font-extrabold tracking-[.25em] uppercase ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
        spinner.style.display = 'none';
        mainIcon.style.display = 'none';
        checkIcon.style.display = 'block';
        checkIcon.className = `fas ${isError ? 'fa-xmark text-rose-300' : 'fa-check text-emerald-300'} text-2xl`;
        closeBtn.style.display = 'block';
        closeBtn.innerHTML = isError ? '<i class="fa-solid fa-rotate-right mr-2"></i>TUTUP & COBA LAGI' : '<i class="fa-solid fa-check mr-2"></i>OK, TUTUP';
        closeBtn.className = `action-btn w-full ${isError ? 'bg-gradient-to-r from-rose-500 to-pink-600 text-white shadow-rose-500/15' : 'bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 shadow-emerald-500/15'} hover:brightness-110 font-extrabold text-xs py-3.5 rounded-2xl shadow-lg cursor-pointer`;
        progressWrap.style.display = 'flex';
        progressBar.className = `progress-bar ${isError ? 'is-error' : 'is-done'}`;
        iconBox.className = `w-20 h-20 rounded-[1.6rem] ${isError ? 'bg-rose-500/12 border-rose-400/35 shadow-[0_0_35px_rgba(251,113,133,.18)]' : 'bg-emerald-500/12 border-emerald-400/35 shadow-[0_0_35px_rgba(52,211,153,.18)]'} border flex items-center justify-center relative`;
        glow.className = `absolute -top-20 left-1/2 -translate-x-1/2 w-56 h-56 ${isError ? 'bg-rose-500/18' : 'bg-emerald-500/18'} blur-[72px] rounded-full pointer-events-none`;
        steps.forEach(el => {
          el.className = `popup-step ${isError ? 'error' : 'done'}`;
          el.lastElementChild.outerHTML = `<i class="fa-solid ${isError ? 'fa-xmark' : 'fa-check'}"></i>`;
        });
      }
    }

    function closeActionPopup() {
      clearTimeout(popupStepTimer);
      const popup = document.getElementById('actionPopup');
      popup.classList.remove('is-open');
      popup.style.display = 'none';
      document.body.classList.remove('modal-open');
    }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("popupCloseBtn").style.display !== "none") closeActionPopup(); });

    function applyProfileUI() {
      const isAdmin = !!(currentProfile && currentProfile.role === 'ADMIN');
      const isBot = !!(currentProfile && currentProfile.role === 'BOT');

      // Role BOT: terisolasi total — sembunyikan SEMUA menu lama, hanya menu
      // ber-atribut data-bot-ok yang tampil. Paksa landing ke halaman BOT.
      if (isBot) {
        document.querySelectorAll('.sidebar-nav').forEach(el => {
          el.style.display = el.classList.contains('bot-only') ? 'flex' : 'none';
        });
        document.querySelectorAll('.nav-group').forEach(g => {
          g.style.display = g.querySelector('.sidebar-nav.bot-only') ? '' : 'none';
        });
        const mw = document.getElementById('market-wrapper');
        if (mw) mw.style.display = 'none';
        if (!BOT_PAGES.includes(currentPage)) switchPage('bot-dashboard');
        return;
      }

      document.querySelectorAll('.nav-extra').forEach(el => el.style.display = 'flex');
      document.querySelectorAll('.bot-only').forEach(el => el.style.display = 'none');
      // Role BOT terisolasi total (lihat komentar di atas) -- grup "Bot" di sidebar
      // cuma berisi tombol ber-class .bot-only, jadi kalau semuanya disembunyikan,
      // wrapper grupnya (judul + chevron) ikut disembunyikan juga. Sebelumnya cuma
      // tombolnya yang disembunyikan, wrapper-nya nyangkut kosong tampil di SEMUA
      // akun non-BOT (admin, operator, viewer).
      document.querySelectorAll('.nav-group').forEach(g => {
        if (g.querySelector('.sidebar-nav.bot-only')) g.style.display = 'none';
      });
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'flex' : 'none');
      restoreNavGroups();
      document.querySelectorAll('.activity-admin-only').forEach(el => el.style.display = isAdmin ? '' : 'none');

      const filterGrid = document.getElementById('activityFilterGrid');
      if (filterGrid) filterGrid.classList.toggle('activity-admin-grid', isAdmin);

      const scope = document.getElementById('activityScopeText');
      if (scope) {
        scope.textContent = isAdmin
          ? 'Admin melihat gabungan Activity Log hari ini dan BackUp Activity Log.'
          : 'Setiap user hanya melihat riwayat akunnya sendiri pada hari ini.';

    }

    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
    function restoreDraft(){const d=JSON.parse(localStorage.getItem('daygroup_draft')||'null');if(!d)return;document.getElementById('inputText').value=d.text||'';document.getElementById('marketSelect').value=d.market||'';document.getElementById('angkaInput').value=d.angka||'';if(d.text)autoGenerate();}
    function saveDraft(){localStorage.setItem('daygroup_draft',JSON.stringify({text:document.getElementById('inputText').value,market:document.getElementById('marketSelect').value,angka:document.getElementById('angkaInput').value}));}
    ['inputText','marketSelect','angkaInput'].forEach(id=>document.getElementById(id).addEventListener('input',saveDraft));
    // Session Timeout DIHAPUS TOTAL untuk SEMUA akun (termasuk admin) — tidak ada
    // lagi logout otomatis karena tidak aktif. Fungsi ini dibiarkan ada (bukan
    // dihapus) supaya pemanggil lama (mis. applyAuthenticatedSession) tidak error;
    // isinya sengaja jadi no-op.
    function resetSessionTimer(){
      clearTimeout(inactivityTimer);
    }
    function statCards(s) {
      const arr = [
        ['Aktivitas Hari Ini', s.today],
        ['Login', s.login],
        ['Pengiriman', s.sends],
        ['Berhasil', s.success],
        ['Gagal', s.failed]
      ];
      if (s.topUser) arr.push(['User Teraktif', s.topUser]);
      if (Number(s.backupTotal || 0) > 0) arr.push(['Arsip Backup', s.backupTotal]);
      return arr.map(item => `<div class="mini-card"><div class="text-[10px] text-slate-300 font-semibold">${item[0]}</div><div class="text-xl font-black mt-1 text-slate-50">${item[1]}</div></div>`).join('');
    }

    function compactLogPreview(value, maxLength) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      if (!text) return '-';
      const limit = Number(maxLength) || 90;
      return text.length > limit ? text.slice(0, limit).trim() + '…' : text;
    }

    function activityStatusBadge(status) {
      const value = String(status || 'INFO').toUpperCase();
      let cls = 'log-status-info';
      let icon = 'fa-circle-info';

      if (value === 'BERHASIL' || value === 'TERKIRIM') {
        cls = 'log-status-success';
        icon = 'fa-circle-check';
      } else if (value === 'GAGAL' || value === 'ERROR') {
        cls = 'log-status-error';
        icon = 'fa-circle-xmark';
      } else if (value === 'DIBLOKIR' || value === 'SEBAGIAN') {
        cls = 'log-status-warning';
        icon = value === 'DIBLOKIR' ? 'fa-ban' : 'fa-triangle-exclamation';
      }

      return `<span class="log-status-badge ${cls}">
        <i class="fa-solid ${icon}"></i>${escapeHtml(value)}
      </span>`;
    }

    function activityActionBadge(action) {
      const value = String(action || 'AKTIVITAS').toUpperCase();
      let icon = 'fa-bolt';

      if (value.includes('LOGIN')) icon = 'fa-right-to-bracket';
      else if (value.includes('LOGOUT')) icon = 'fa-right-from-bracket';
      else if (value.includes('SEND') || value.includes('KIRIM')) icon = 'fa-paper-plane';
      else if (value.includes('COPY')) icon = 'fa-copy';
      else if (value.includes('HALAMAN')) icon = 'fa-window-maximize';
      else if (value.includes('DUPLIKAT')) icon = 'fa-shield-halved';

      return `<span class="log-action-badge">
        <i class="fa-solid ${icon}"></i>${escapeHtml(value)}
      </span>`;
    }

    function expandableLogText(value, emptyText) {
      const full = String(value || '').trim();
      if (!full) return `<span class="text-slate-600">${escapeHtml(emptyText || '-')}</span>`;

      const preview = compactLogPreview(full, 105);
      const needsExpand = full.replace(/\s+/g, ' ').trim().length > 105 || full.includes('\n');

      if (!needsExpand) {
        return `<div class="log-plain-text">${escapeHtml(full)}</div>`;
      }

      return `<details class="log-details">
        <summary>
          <span>${escapeHtml(preview)}</span>
          <span class="log-details-label">Lihat detail</span>
        </summary>
        <div class="log-details-full">${escapeHtml(full)}</div>
      </details>`;
    }

    function renderLogs(rows, target) {
      const body = document.getElementById(target);
      if (!body) return;

      if (!Array.isArray(rows) || !rows.length) {
        body.innerHTML = '<tr><td colspan="7" class="text-center text-slate-500 py-8">Belum ada aktivitas yang cocok dengan filter.</td></tr>';
        return;
      }

      body.innerHTML = rows.map(row => {
        const dateParts = String(row[0] || '').split(' ');
        const date = dateParts[0] || '-';
        const time = dateParts.slice(1).join(' ') || '';
        const source = String(row[6] || 'HARI INI').toUpperCase();
        const sourceClass = source === 'BACKUP' ? 'activity-source-backup' : 'activity-source-current';
        const sourceLabel = source === 'BACKUP' ? 'BACKUP' : 'HARI INI';

        return `<tr class="activity-log-row">
          <td class="log-time-cell">
            <b>${escapeHtml(date)}</b>
            <span>${escapeHtml(time)}</span>
          </td>
          <td><span class="log-user-chip"><i class="fa-solid fa-user"></i>${escapeHtml(row[1] || '-')}</span></td>
          <td>${activityActionBadge(row[2])}</td>
          <td>${activityStatusBadge(row[3])}</td>
          <td>${expandableLogText(row[4], 'Tidak ada keterangan')}</td>
          <td>${expandableLogText(row[5], 'Tidak ada data')}</td>
          <td><span class="activity-source-chip ${sourceClass}"><i class="fa-solid ${source === 'BACKUP' ? 'fa-box-archive' : 'fa-bolt'}"></i>${sourceLabel}</span></td>
        </tr>`;
      }).join('');
      FX.reveal(Array.from(body.querySelectorAll('tr')).slice(0, 28), { y: 8, step: 12, duration: 320, scale: 1 });
    }

    function activityId(mode, suffix) {
      return mode === 'admin' ? 'adminActivity' + suffix : 'activity' + suffix;
    }

    function renderSkeletonRows(target, count) {
      const body = document.getElementById(target);
      if (!body) return;
      const cols = 7;
      const row = `<tr class="activity-log-row">${Array.from({length: cols}).map(() => `<td><span class="skeleton-bar" style="width:${60 + Math.round(Math.random()*30)}%"></span></td>`).join('')}</tr>`;
      body.innerHTML = row.repeat(count || 6);
    }

    function getActivityRequest(mode, withFacets) {
      const state = activityViews[mode] || activityViews.activity;
      const value = suffix => {
        const el = document.getElementById(activityId(mode, suffix));
        return el ? String(el.value || '').trim() : '';
      };

      return {
        page: state.page,
        pageSize: state.pageSize,
        query: value('Search'),
        username: value('UserFilter'),
        action: value('ActionFilter'),
        status: value('StatusFilter'),
        source: value('SourceFilter') || 'ALL',
        dateFrom: value('DateFrom'),
        dateTo: value('DateTo'),
        // filterOptions (DISTINCT full-scan D1) hanya saat load manual, bukan auto-refresh
        facets: !!withFacets
      };
    }

    function fillActivitySelect(id, placeholder, values) {
      const select = document.getElementById(id);
      if (!select) return;
      if (values == null) return; // auto-refresh tanpa facets -> pertahankan opsi lama
      const current = select.value;
      const options = [`<option value="">${escapeHtml(placeholder)}</option>`]
        .concat((values || []).map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`));
      select.innerHTML = options.join('');
      if ([...select.options].some(option => option.value === current)) select.value = current;
    }

    function updateActivityMeta(mode, data) {
      const pagination = data.pagination || {page:1,totalPages:1,total:0,hasPrev:false,hasNext:false};
      const sourceInfo = data.sourceInfo || {};
      const prefix = mode === 'admin' ? 'adminActivity' : 'activity';

      const meta = document.getElementById(prefix + 'Meta');
      if (meta) {
        const scanNote = sourceInfo.scanLimited
          ? ` • backup file utama dibatasi ${sourceInfo.backupScanned} baris terbaru`
          : '';
        const archiveNote = Number(sourceInfo.archiveScanned || 0) > 0
          ? ` • +${sourceInfo.archiveScanned} baris dari file arsip terpisah`
          : '';
        meta.textContent = `${pagination.total} data ditemukan • ${sourceInfo.currentTotal || 0} hari ini • ${sourceInfo.backupTotal || 0} backup${scanNote}${archiveNote}`;
      }

      const label = document.getElementById(prefix + 'PageLabel');
      if (label) label.textContent = `Halaman ${pagination.page} / ${pagination.totalPages}`;

      const prev = document.getElementById(prefix + 'PrevBtn');
      const next = document.getElementById(prefix + 'NextBtn');
      if (prev) prev.disabled = !pagination.hasPrev;
      if (next) next.disabled = !pagination.hasNext;

      activityViews[mode].page = pagination.page || 1;
    }

    function applyActivityFilters(mode) {
      activityViews[mode].page = 1;
      loadDashboard(true, mode);
    }

    function resetActivityFilters(mode) {
      ['Search','UserFilter','ActionFilter','StatusFilter','DateFrom','DateTo'].forEach(suffix => {
        const el = document.getElementById(activityId(mode, suffix));
        if (el) el.value = '';
      });
      const source = document.getElementById(activityId(mode, 'SourceFilter'));
      if (source) source.value = 'ALL';
      activityViews[mode].page = 1;
      loadDashboard(true, mode);
    }

    function changeActivityPage(mode, direction) {
      activityViews[mode].page = Math.max(1, activityViews[mode].page + Number(direction || 0));
      loadDashboard(false, mode);
    }

    const lastLogSignature = { activity:'', admin:'' };

    // Render data dashboard ke DOM. Dipakai loadDashboard (fetch manual) DAN live-poll.
    function applyDashboardData(data, mode, silent) {
      mode = mode === 'admin' ? 'admin' : 'activity';
      const isAdminMode = mode === 'admin';
      const bodyTarget = isAdminMode ? 'adminActivityBody' : 'activityBody';
      const userStats = document.getElementById('userStats');
      const adminStats = document.getElementById('adminStats');
      const adminStatus = document.getElementById('adminLoadStatus');
      if (!data.pagination) data.pagination = { page:1, pageSize:75, total:(data.rows||[]).length, totalPages:1, hasPrev:false, hasNext:false };

      if (userStats) userStats.innerHTML = statCards(data.stats);
      if (isAdminMode && adminStats) adminStats.innerHTML = statCards(data.stats);

      // Hanya render ulang tabel bila isinya benar-benar berubah -> tidak mengganggu
      // baris log yang sedang dibuka user saat auto-refresh.
      const sig = (data.rows.length ? String(data.rows[0][0]) + '|' + String(data.rows[0][4] || '') : 'empty')
        + '#' + ((data.pagination && data.pagination.total) || 0)
        + '@' + ((data.pagination && data.pagination.page) || 1);
      if (lastLogSignature[mode] !== sig) {
        renderLogs(data.rows, bodyTarget);
        lastLogSignature[mode] = sig;
      }
      updateActivityMeta(mode, data);

      const options = data.filterOptions || null;
      fillActivitySelect(activityId(mode, 'UserFilter'), 'Semua User', options && options.usernames);
      fillActivitySelect(activityId(mode, 'ActionFilter'), 'Semua Aksi', options && options.actions);
      fillActivitySelect(activityId(mode, 'StatusFilter'), 'Semua Status', options && options.statuses);

      if (data.role === 'ADMIN') {
        const maintenance = data.maintenance || {enabled:false,message:''};
        maintenanceState = !!maintenance.enabled;
        const switchEl = document.getElementById('maintenanceSwitch');
        const messageEl = document.getElementById('maintenanceMessage');
        if (switchEl) switchEl.classList.toggle('on', maintenanceState);
        if (messageEl && document.activeElement !== messageEl) messageEl.value = maintenance.message || '';
      } else if (data.maintenance) {
        setMaintenanceLock(data.maintenance.enabled, data.maintenance.message);
      }

      if (!silent && isAdminMode && adminStatus) {
        adminStatus.className = 'text-xs text-emerald-300 rounded-2xl border border-emerald-500/25 bg-emerald-500/5 px-4 py-3';
        adminStatus.textContent = `Data berhasil dimuat • ${data.pagination.total} aktivitas ditemukan`;
        setTimeout(() => adminStatus.style.display = 'none', 2200);
      }

      pageDataCache[mode] = data;
      pageFetchedAt[mode] = Date.now();
    }

    function loadDashboard(forceRefresh, mode) {
      mode = mode === 'admin' ? 'admin' : 'activity';
      const isAdminMode = mode === 'admin';
      const adminStatus = document.getElementById('adminLoadStatus');
      const userStats = document.getElementById('userStats');
      const adminStats = document.getElementById('adminStats');
      const bodyTarget = isAdminMode ? 'adminActivityBody' : 'activityBody';

      if (isAdminMode && adminStatus) {
        adminStatus.style.display = 'block';
        adminStatus.className = 'text-xs text-cyan-300 rounded-2xl border border-cyan-500/20 bg-cyan-500/5 px-4 py-3';
        adminStatus.textContent = 'Memuat statistik, Activity Log, dan BackUp Activity Log...';
      }

      if (!currentUser) {
        if (adminStatus) {
          adminStatus.className = 'text-xs text-rose-300 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3';
          adminStatus.textContent = 'Sesi user tidak ditemukan. Silakan logout lalu login kembali.';
        }
        return;
      }

      // Skeleton hanya kalau belum ada data yang bisa ditampilkan (hindari "kedip"
      // saat refresh diam-diam / polling).
      if (!pageDataCache[mode]) renderSkeletonRows(bodyTarget, 6);
      const slowNoticeTimer = setTimeout(() => {
        if (isAdminMode && adminStatus) adminStatus.textContent = 'Masih memuat, data cukup banyak... mohon tunggu sebentar.';
      }, 5000);

      google.script.run
        .withSuccessHandler(data => {
          clearTimeout(slowNoticeTimer);
          try {
            if (!data || !data.stats || !Array.isArray(data.rows)) {
              throw new Error('Format data dashboard tidak lengkap. Pastikan code.gs Smart V5 sudah dipasang.');
            }
            applyDashboardData(data, mode);
          } catch (err) {
            renderLogs([], bodyTarget);
            if (adminStatus) {
              adminStatus.className = 'text-xs text-rose-300 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3';
              adminStatus.textContent = err.message;
            }
          }
        })
        .withFailureHandler(error => {
          clearTimeout(slowNoticeTimer);
          const message = (error && error.message) || 'Gagal menghubungi server dashboard.';
          renderLogs([], bodyTarget);
          if (adminStatus) {
            adminStatus.className = 'text-xs text-rose-300 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3';
            adminStatus.textContent = message + ' Pastikan code.gs terbaru sudah dideploy.';
          }
          toast(message);
        })
        .getDashboardData(currentSessionToken, getActivityRequest(mode, true));
    }

    function runActivityBackupNow() {
      const status = document.getElementById('backupActivityStatus');
      if (status) status.textContent = 'Menjalankan backup...';
      google.script.run
        .withSuccessHandler(result => {
          if (status) status.textContent = result.message || 'Backup selesai.';
          toast(result.message || 'Backup selesai.');
          loadDashboard(true, 'admin');
        })
        .withFailureHandler(error => {
          const message = (error && error.message) || 'Backup gagal.';
          if (status) status.textContent = message;
          toast(message);
        })
        .adminRunActivityBackup(currentSessionToken);
    }

    let autoPostEnabledState = null;
    function paintAutoPostToggle() {
      const btn = document.getElementById('autoPostToggleBtn');
      const status = document.getElementById('autoPostStatus');
      if (btn) {
        const on = !!autoPostEnabledState;
        btn.innerHTML = on
          ? '<i class="fa-solid fa-power-off mr-2"></i>NONAKTIFKAN AUTO POSTING'
          : '<i class="fa-solid fa-power-off mr-2"></i>AKTIFKAN AUTO POSTING';
        btn.className = (on
          ? 'bg-gradient-to-r from-rose-500 to-red-600 text-white'
          : 'bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950')
          + ' px-4 py-3 rounded-2xl text-[10px] font-extrabold';
      }
      if (status && autoPostEnabledState !== null) {
        status.textContent = autoPostEnabledState
          ? 'Status: AKTIF — router akan mengirim tiap sesi jam selama ada operator login.'
          : 'Status: NONAKTIF — tidak ada prediksi/penutup yang dikirim otomatis.';
        status.className = 'text-[10px] mt-2 ' + (autoPostEnabledState ? 'text-emerald-400' : 'text-rose-300');
      }
    }
    function loadAutoPostStatus() {
      google.script.run
        .withSuccessHandler(d => {
          if (d && typeof d.autoPostEnabled === 'boolean') { autoPostEnabledState = d.autoPostEnabled; paintAutoPostToggle(); }
        })
        .withFailureHandler(() => {})
        .adminListActiveSessions(currentSessionToken);
    }
    function toggleAutoPost() {
      const turnOn = !autoPostEnabledState;
      const btn = document.getElementById('autoPostToggleBtn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>MENYIMPAN...'; }

    let centerNoticeResolver = null;
    let centerNoticeTimer = null;
    let centerNoticeShowing = false;
    const centerNoticeQueue = [];

    // Modal ini cuma satu di DOM, jadi kalau ada pemanggilan openCenterNotice() kedua
    // saat modal pertama masih terbuka (mis. notifikasi background muncul di tengah
    // dialog konfirmasi), request kedua diantre dulu -- BUKAN menimpa resolver yang
    // sedang aktif. Kalau ditimpa, promise pemanggil pertama tidak akan pernah resolve
    // dan kode yang `await`-nya (mis. konfirmasi hapus user) nge-hang selamanya.
    function openCenterNotice(options) {
      if (centerNoticeShowing) {
        return new Promise(resolve => centerNoticeQueue.push({ options, resolve }));
      }
      return showCenterNotice(options);
    }

    function showCenterNotice(options) {
      centerNoticeShowing = true;
      const config = options || {};
      const modal = document.getElementById('centerNoticeModal');
      const iconBox = document.getElementById('centerNoticeIcon');
      const icon = iconBox.querySelector('i');
      const title = document.getElementById('centerNoticeTitle');
      const message = document.getElementById('centerNoticeMessage');
      const actions = document.getElementById('centerNoticeActions');
      const cancelBtn = document.getElementById('centerNoticeCancel');
      const confirmBtn = document.getElementById('centerNoticeConfirm');

      clearTimeout(centerNoticeTimer);

      const type = config.type || 'info';
      const iconMap = {
        info: 'fa-circle-info',
        success: 'fa-circle-check',
        warning: 'fa-triangle-exclamation',
        danger: 'fa-trash-can'
      };

      iconBox.className = `center-notice-icon ${type}`;
      icon.className = `fa-solid ${iconMap[type] || iconMap.info}`;
      title.textContent = config.title || 'Informasi';
      message.textContent = config.message || '';

      confirmBtn.textContent = config.confirmText || 'OK';
      confirmBtn.className = `center-notice-btn ${type === 'danger' ? 'danger' : type === 'warning' ? 'warning' : 'primary'}`;

      const showCancel = !!config.showCancel;
      cancelBtn.style.display = showCancel ? 'block' : 'none';
      cancelBtn.textContent = config.cancelText || 'BATAL';
      actions.classList.toggle('two', showCancel);

      modal.classList.add('open');
      document.body.classList.add('modal-open');

      return new Promise(resolve => {
        centerNoticeResolver = resolve;

        const finish = answer => {
          modal.classList.remove('open');
          document.body.classList.remove('modal-open');
          const resolver = centerNoticeResolver;
          centerNoticeResolver = null;
          centerNoticeShowing = false;
          if (resolver) resolver(answer);
          const next = centerNoticeQueue.shift();
          if (next) showCenterNotice(next.options).then(next.resolve);
        };

        confirmBtn.onclick = () => finish(true);
        cancelBtn.onclick = () => finish(false);

        if (config.autoCloseMs && !showCancel) {
          centerNoticeTimer = setTimeout(() => finish(true), config.autoCloseMs);
        }
      });
    }

    function notifyCenter(message, type, title) {
      return openCenterNotice({
        title: title || (type === 'success' ? 'Berhasil' : type === 'danger' ? 'Terjadi Kesalahan' : type === 'warning' ? 'Perhatian' : 'Informasi'),
        message: String(message || ''),
        type: type || 'info',
        confirmText: 'TUTUP',
        autoCloseMs: type === 'success' ? 1800 : 0
      });
    }

    function confirmCenter(options) {
      return openCenterNotice(Object.assign({
        showCancel: true,
        confirmText: 'YA, LANJUTKAN',
        cancelText: 'BATAL'
      }, options || {}));
    }

    /* ===== A11y modal: tutup dengan Escape + klik area gelap di luar kartu =====
       Sebelumnya hanya centerNotice & actionPopup yang bisa ditutup pakai Escape;
       modal lain menjebak pengguna keyboard. */
    function closeTopModal() {
      const openShell = [...document.querySelectorAll('.modal-shell.open')].pop();
      if (openShell) {
        openShell.classList.remove('open');
        if (!document.querySelector('.modal-shell.open')) document.body.classList.remove('modal-open');
        return true;
      }
      const edit = document.getElementById('userEditModal');
      if (edit && edit.style.display !== 'none' && edit.classList.contains('modal-shell')) { closeUserModal(); return true; }
      const result = document.getElementById('resultModal');
      if (result && result.style.display !== 'none') { closeModal(); return true; }
      return false;
    }
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      // actionPopup & centerNotice punya penanganan sendiri; jangan ganggu saat aktif.
      if (document.getElementById('actionPopup').style.display !== 'none') return;
      if (document.getElementById('centerNoticeModal').classList.contains('open')) return;
      closeTopModal();
    });
    ['sendConfirmModal','sendResultModal','predictionSendModal','userEditModal','resultModal'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('mousedown', e => { if (e.target === el) closeTopModal(); });
    });

    function toggleMaintenance(){maintenanceState=!maintenanceState;document.getElementById('maintenanceSwitch').classList.toggle('on',maintenanceState);}
    function saveMaintenance(){google.script.run.withSuccessHandler(x=>{maintenanceState=x.enabled;document.getElementById('maintenanceSwitch').classList.toggle('on',maintenanceState);toast('Pengaturan maintenance disimpan');}).withFailureHandler(e=>toast(e.message)).setMaintenance(currentSessionToken,maintenanceState,document.getElementById('maintenanceMessage').value);}

    /* =========================================================
       MENU INVEST — AutoCheck batas line invest per user.
       Setting (BASE_URL, PHPSESSID, dst) disimpan di server (Script Properties),
       scan berat jalan di latar belakang + polling status.
       ========================================================= */
    let investStatusTimer = null;
    // Hanya field yang tampil di form. Sisanya (timezone, periode lookback, page
    // size, dst) tetap di default server dan tidak diutak-atik dari panel.
    const INVEST_NUM_FIELDS = ['LIMIT_2D','LIMIT_3D','LIMIT_4D'];

    function investVal(id){ const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
    function investSetVal(id, v){ const el = document.getElementById(id); if (el) el.value = (v == null ? '' : v); }

    function loadInvestConfig() {
      const box = document.getElementById('investConfigStatus');
      if (box) box.textContent = 'Memuat setting tersimpan...';
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.success) { if (box) box.textContent = (res && res.message) || 'Gagal memuat setting.'; return; }
          const c = res.config || {};
          investSetVal('investBaseUrl', c.BASE_URL);
          investSetVal('investPhpsessid', c.PHPSESSID);
          investSetVal('investKoderedis', c.KODEREDIS);
          investSetVal('investCookieExtra', c.COOKIE_EXTRA);
          INVEST_NUM_FIELDS.forEach(k => investSetVal('invest_' + k, c[k]));
          investSetVal('investPasaranRaw', '');
          const pc = document.getElementById('investPasaranCount');
          if (pc) pc.textContent = String(c.PASARAN_COUNT || 0);
          if (box) box.textContent = 'Setting terakhir tersimpan di server — tidak perlu diisi ulang selama PHPSESSID belum berubah.';
          // Belum ada sesi tersimpan -> buka form; kalau sudah ada -> sembunyikan.
          const dbox = document.getElementById('investSettingBox');
          if (dbox) dbox.open = !(c.PHPSESSID || c.COOKIE_EXTRA);
          renderInvestState(res.state, res.warningCount);
          // Buka menu saat scan MASIH jalan (mis. dipicu user lain) -> ikut pantau.
          const ss = res.state && res.state.state;
          if (ss === 'running' || ss === 'paused') startInvestPolling();
        })
        .withFailureHandler(e => { if (box) box.textContent = 'Gagal: ' + ((e && e.message) || e); })
        .investGetConfig(currentSessionToken);
      loadInvestWarnings();
    }

    function saveInvestConfig() {
      const btn = document.getElementById('investSaveBtn');
      const payload = {
        BASE_URL: investVal('investBaseUrl'),
        PHPSESSID: investVal('investPhpsessid'),
        KODEREDIS: investVal('investKoderedis'),
        COOKIE_EXTRA: investVal('investCookieExtra')
      };
      if (investVal('investPasaranRaw')) payload.PASARAN_RAW = investVal('investPasaranRaw');
      INVEST_NUM_FIELDS.forEach(k => payload[k] = investVal('invest_' + k));
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>MENYIMPAN...'; }
      google.script.run
        .withSuccessHandler(res => {
          if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i>SIMPAN SETTING'; }
          if (res && res.success) {
            toast('Setting INVEST tersimpan');
            const c = res.config || {};
            investSetVal('investPhpsessid', c.PHPSESSID);
            investSetVal('investKoderedis', c.KODEREDIS);
            investSetVal('investCookieExtra', c.COOKIE_EXTRA);
            INVEST_NUM_FIELDS.forEach(k => investSetVal('invest_' + k, c[k]));
            investSetVal('investPasaranRaw', '');
            const pc = document.getElementById('investPasaranCount');
            if (pc) pc.textContent = String(c.PASARAN_COUNT || 0);
            if (c.PASARAN_COUNT) toast(c.PASARAN_COUNT + ' pasaran panel tersimpan');
            const dbox = document.getElementById('investSettingBox');
            if (dbox) dbox.open = false;
          } else {
            toast((res && res.message) || 'Gagal menyimpan setting');
          }
        })
        .withFailureHandler(e => {
          if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i>SIMPAN SETTING'; }
          toast('Gagal: ' + ((e && e.message) || e));
        })
        .investSaveConfig(currentSessionToken, payload);
    }

    function testInvestSession() {
      const box = document.getElementById('investConnStatus');
      if (box) { box.textContent = 'Mengecek session ke panel agen...'; box.className = 'text-[11px] text-cyan-300 mt-2'; }
      google.script.run
        .withSuccessHandler(res => {
          if (box) {
            box.textContent = (res && res.message) || 'Selesai.';
            box.className = 'text-[11px] mt-2 ' + (res && res.success ? 'text-emerald-300' : 'text-rose-300');
          }
          if (res && res.success) toast('Session INVEST valid');
        })
        .withFailureHandler(e => { if (box) { box.textContent = 'Gagal: ' + ((e && e.message) || e); box.className = 'text-[11px] text-rose-300 mt-2'; } })
        .investTestSession(currentSessionToken);
    }

    function investRequireOwnConfig() {
      // Config INVEST per-user: tiap staff HARUS isi sesinya sendiri dulu.
      if (investVal('investPhpsessid') || investVal('investCookieExtra')) return true;
      toast('Isi PHPSESSID kamu dulu di SETTING, lalu SIMPAN.');
      const dbox = document.getElementById('investSettingBox');
      if (dbox) { dbox.open = true; }
      const el = document.getElementById('investPhpsessid');
      if (el) { try { el.scrollIntoView({ block: 'center' }); el.focus(); } catch (e) {} }
      return false;
    }

    function startInvestScan() {
      if (!investRequireOwnConfig()) return;
      confirmCenter({
        type: 'warning',
        title: 'Mulai Scan INVEST?',
        message: 'Scan menimpa hasil sebelumnya dan berjalan di latar belakang (beberapa menit, lanjut otomatis). Pastikan PHPSESSID kamu sudah disimpan dan masih valid.',
        confirmText: 'YA, MULAI SCAN'
      }).then(ok => {
        if (!ok) return;
        google.script.run
          .withSuccessHandler(res => {
            if (!res || res.success === false) {
              toast((res && res.message) || 'Scan tidak bisa dimulai.');
              if (res && /phpsessid/i.test(res.message || '')) {
                const dbox = document.getElementById('investSettingBox');
                if (dbox) dbox.open = true;
              }
              renderInvestState((res && res.state) || {});
              return;
            }
            toast(res.message || 'Scan dimulai');
            investBeginScanUI(res.state || { state: 'running', cursor: 0, total: 63 });
            startInvestPolling();
          })
          .withFailureHandler(e => toast('Gagal memulai scan: ' + ((e && e.message) || e)))
          .investStartScan(currentSessionToken);
      });
    }

    function continueInvestScan() {
      if (!investRequireOwnConfig()) return;
      google.script.run
        .withSuccessHandler(res => {
          if (!res || res.success === false) { toast((res && res.message) || 'Tidak bisa dilanjutkan.'); return; }
          toast(res.message || 'Scan dilanjutkan');
          if (res.state) renderInvestState(res.state, 0);
          startInvestPolling();
        })
        .withFailureHandler(e => toast('Gagal: ' + ((e && e.message) || e)))
        .investContinueScan(currentSessionToken);
    }

    function resetInvestScan() {
      confirmCenter({
        type: 'danger',
        title: 'Reset Scan INVEST?',
        message: 'Menghentikan scan yang tertunda dan menghapus penanda progres. Tabel hasil WARNING TIDAK dihapus (baru ditimpa saat scan berikutnya).',
        confirmText: 'YA, RESET'
      }).then(ok => {
        if (!ok) return;
        google.script.run
          .withSuccessHandler(res => { toast((res && res.message) || 'Direset'); stopInvestPolling(); loadInvestConfig(); })
          .withFailureHandler(e => toast('Gagal: ' + ((e && e.message) || e)))
          .investResetScan(currentSessionToken);
      });
    }

    function renderInvestState(state, warnCount) {
      const badge = document.getElementById('investStateBadge');
      const meta = document.getElementById('investStateMeta');
      const contBtn = document.getElementById('investContinueBtn');
      if (!badge) return;
      const s = (state && state.state) || 'idle';
      const map = {
        idle:            ['SIAP',                     'bg-slate-500/15 text-slate-300'],
        running:         ['SCAN BERJALAN',            'bg-cyan-500/15 text-cyan-300'],
        paused:          ['JEDA · LANJUT OTOMATIS',   'bg-amber-500/15 text-amber-300'],
        session_expired: ['SESSION EXPIRED',          'bg-rose-500/15 text-rose-300'],
        done:            ['SELESAI',                  'bg-emerald-500/15 text-emerald-300'],
        error:           ['ERROR',                    'bg-rose-500/15 text-rose-300']
      };
      const m = map[s] || map.idle;
      const spin = (s === 'running' || s === 'paused') ? '<i class="fa-solid fa-circle-notch fa-spin" style="margin-right:6px"></i>' : '';
      badge.innerHTML = spin + m[0];
      badge.className = 'px-3 py-1 rounded-full text-[10px] font-extrabold whitespace-nowrap ' + m[1];

      const total = Number(state && state.total) || 0;
      const cur   = Number(state && state.cursor) || 0;

      const parts = [];
      const msg = (state && state.message) || '';
      // Kalau pesan sudah memuat "pasaran X/Y", jangan tampilkan hitungan terpisah.
      const msgHasCount = /pasaran\s+\d+\s*\/\s*\d+/i.test(msg);
      if (total && !msgHasCount) parts.push('pasaran ' + cur + '/' + total + (s === 'running' || s === 'paused' ? ' — sedang scan' : ''));
      const wc = (typeof warnCount === 'number') ? warnCount : (state && state.warningCount);
      if (typeof wc === 'number' && wc > 0) parts.push(wc + ' user lewat batas');
      if (msg) parts.push(msg);
      if (meta) meta.textContent = parts.join('  •  ') || 'Belum ada scan.';

      // Progress bar (14/63 -> visual + stripe berjalan biar jelas hidup)
      const wrap = document.getElementById('investProgressWrap');
      const bar  = document.getElementById('investProgressBar');
      if (wrap && bar) {
        const show = ['running', 'paused', 'session_expired', 'done', 'error'].indexOf(s) >= 0;
        wrap.style.display = show ? 'block' : 'none';
        const pct = total ? Math.min(100, Math.round(cur / total * 100)) : 0;
        bar.style.background = (s === 'done')
          ? 'linear-gradient(90deg,#34d399,#14b8a6)'
          : (s === 'session_expired' || s === 'error')
            ? 'linear-gradient(90deg,#fb7185,#e11d48)'
            : 'linear-gradient(90deg,#34d399,#22d3ee)';
        if ((s === 'running' || s === 'paused') && (!total || cur === 0)) {
          // Belum ada angka nyata -> bar indeterminate (sapuan) biar tetap "hidup".
          bar.className = 'progress-bar is-loading';
          bar.style.width = '';
        } else {
          bar.className = 'progress-bar' + (s === 'running' ? ' invest-running' : '');
          bar.style.width = (s === 'done' ? 100 : Math.max(pct, s === 'running' ? 4 : 0)) + '%';
        }
      }

      // Tombol MULAI SCAN dikunci + spinner selama scan jalan.
      const startBtn = document.getElementById('investStartBtn');
      if (startBtn) {
        const busy = (s === 'running' || s === 'paused');
        startBtn.disabled = busy;
        startBtn.innerHTML = busy
          ? '<i class="fa-solid fa-circle-notch fa-spin"></i>SEDANG SCAN...'
          : '<i class="fa-solid fa-play"></i>MULAI SCAN';
      }

      if (contBtn) contBtn.style.display = (s === 'session_expired') ? 'inline-flex' : 'none';

      // Session mati -> buka form setting supaya PHPSESSID baru gampang ditempel.
      if (s === 'session_expired') {
        const dbox = document.getElementById('investSettingBox');
        if (dbox) dbox.open = true;
      }

      // Scan sedang jalan -> hasil di kotak PASTI kosong (server sudah/akan
      // dikosongkan). Jadi kalau masih ada kartu sisa scan lama, hapus dulu
      // supaya yang tampil animasi Loading, bukan history lama.
      const list = document.getElementById('investWarningList');
      if (list && (s === 'running' || s === 'paused') && list.dataset.has === '1') {
        list.dataset.has = '0';
        list.innerHTML = '';
      }
      // Selama belum ada hasil, refresh placeholder (angka pasaran X/Y ikut update).
      if (!investHasRows()) investRenderWarnPlaceholder(state);
    }

    // Dipanggil saat MULAI / LANJUTKAN scan: langsung bersihkan tampilan lama &
    // tampilkan Loading + bar 0%, jangan tunggu poll pertama (5 dtk).
    function investBeginScanUI(state) {
      const list = document.getElementById('investWarningList');
      if (list) { list.dataset.has = '0'; list.innerHTML = ''; }
      const meta = document.getElementById('investWarningMeta');
      if (meta) meta.textContent = 'Scan berjalan…';
      renderInvestState(state || { state: 'running', cursor: 0, total: 63 }, 0);
    }

    function startInvestPolling() {
      stopInvestPolling();
      pollInvestStatus();
      // Beberapa poll pertama lebih rapat biar progres kelihatan cepat naik,
      // lalu melambat ke 4 dtk.
      let fast = 4;
      investStatusTimer = setInterval(() => {
        pollInvestStatus();
        if (--fast === 0) {
          clearInterval(investStatusTimer);
          investStatusTimer = setInterval(pollInvestStatus, 4000);
        }
      }, 1800);
    }
    function stopInvestPolling() {
      if (investStatusTimer) { clearInterval(investStatusTimer); investStatusTimer = null; }
    }
    function pollInvestStatus() {
      if (currentPage !== 'invest' || !currentUser) { stopInvestPolling(); return; }
      google.script.run
        .withSuccessHandler(st => {
          renderInvestState(st, st && st.warningCount);
          if (st && ['done','idle','session_expired','error'].indexOf(st.state) >= 0) {
            stopInvestPolling();
            if (st.state === 'done') loadInvestWarnings();
          }
        })
        .withFailureHandler(() => {})
        .investGetStatus(currentSessionToken);
    }

    // "yyyy-MM-dd" -> "07 Sep". Juga menangani sisa data lama bentuk Date string.
    function investFmtDate(v) {
      const s = String(v || '').trim();
      let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      let d;
      if (m) d = new Date(+m[1], +m[2] - 1, +m[3]);
      else { d = new Date(s); if (isNaN(d.getTime())) return s; }
      const b = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return d.getDate() + ' ' + b[d.getMonth()];
    }

    function investHasRows() {
      const list = document.getElementById('investWarningList');
      return !!(list && list.dataset.has === '1');
    }

    // Placeholder kotak hasil — animasi "sedang scan" biar kalau pindah menu &
    // balik lagi tetap kelihatan Loading, bukan "kosong".
    function investRenderWarnPlaceholder(state) {
      const list = document.getElementById('investWarningList');
      if (!list || list.dataset.has === '1') return;
      const s = (state && state.state) || 'idle';
      const cur = Number(state && state.cursor) || 0;
      const total = Number(state && state.total) || 0;
      if (s === 'running' || s === 'paused') {
        list.innerHTML = `<div class="invest-warn-card" style="border-color:rgba(52,211,153,.2)">
          <div class="invest-scanning">
            <span class="invest-scan-orbit"></span>
            <div>
              <div class="invest-scan-title">Sedang scan pasaran ${cur}/${total || '?'}…</div>
              <div class="invest-scan-sub">Hasil user lewat batas muncul otomatis saat scan selesai. Aman ditinggal / pindah menu.</div>
              <div class="invest-scan-dots"><span></span><span></span><span></span></div>
            </div>
          </div>
        </div>`;
      } else if (s === 'session_expired') {
        list.innerHTML = '<div class="text-center text-rose-300 py-8 text-[11px]">Scan berhenti — session agen expired. Tempel PHPSESSID baru, SIMPAN, lalu LANJUTKAN SCAN.</div>';
      } else {
        list.innerHTML = '<div class="text-center text-slate-500 py-8 text-[11px]">Belum ada hasil scan. Isi setting lalu klik MULAI SCAN.</div>';
      }
    }

    function investDateKey(d) {
      const m = String(d || '').match(/(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1] + m[2] + m[3];
      const t = new Date(String(d || ''));
      return isNaN(t.getTime()) ? String(d || '') : ('' + t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0'));
    }

    function investUserCard(u) {
      const hits = u.hits || [];
      // Kelompokkan per tanggal, urut kronologis (6 Sep dulu, baru 7 Sep).
      const byDate = {};
      hits.forEach(h => { const k = h.tanggal || '?'; (byDate[k] = byDate[k] || []).push(h); });
      const dkeys = Object.keys(byDate).sort((a, b) => investDateKey(a) < investDateKey(b) ? -1 : 1);

      const sections = dkeys.map(dk => {
        const arr = byDate[dk];
        const nPasar = new Set(arr.map(h => h.pasaran)).size;
        const rows = arr.map(h => {
          if (h.error) return `<li class="invest-hit is-err">${escapeHtml(h.pasaran || '-')} — ${escapeHtml(h.error)}</li>`;
          return `<li class="invest-hit">
            <b>${escapeHtml(h.pasaran || '-')}</b> · Periode ${escapeHtml(String(h.periode))} · <span class="ihg">${escapeHtml(String(h.game))}</span>
            <span class="invest-hit-info">( ${escapeHtml(String(h.line))} Line — Lewat Batas, limit ${escapeHtml(String(h.limit))}, +${escapeHtml(String(h.over))} )</span>
          </li>`;
        }).join('');
        return `<div class="invest-date-group">
          <div class="invest-date-head">${escapeHtml(investFmtDate(dk))}<span> · ${nPasar} pasaran</span></div>
          <ul class="invest-hit-list">${rows}</ul>
        </div>`;
      }).join('');

      const badge = Number(u.excess || 0) > 0 ? `+${u.excess} line lewat batas` : `${hits.length} catatan`;
      return `<div class="invest-warn-card">
        <div class="invest-warn-head">
          <span class="invest-warn-user">${escapeHtml(u.user || '-')}</span>
          <span class="invest-warn-badge">${escapeHtml(badge)}</span>
        </div>
        ${sections || '<div class="invest-hit is-err">' + escapeHtml(u.raw || 'tidak ada rincian') + '</div>'}
      </div>`;
    }

    function loadInvestWarnings() {
      const list = document.getElementById('investWarningList');
      const meta = document.getElementById('investWarningMeta');
      if (!list) return;
      google.script.run
        .withSuccessHandler(res => {
          const users = (res && res.users) || [];
          if (meta) meta.textContent = users.length ? (users.length + ' user melebihi batas invest') : 'Belum ada hasil scan.';
          if (!users.length) {
            list.dataset.has = '0';
            investRenderWarnPlaceholder(res && res.state);
          } else {
            list.dataset.has = '1';
            list.innerHTML = users.map(investUserCard).join('');
          }
          renderInvestState(res && res.state, res && res.warningCount);
        })
        .withFailureHandler(() => {})
        .investGetWarnings(currentSessionToken);
    }

    /* ========================= BOT · NEWS ========================= */
    function botEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

    let botHistoryCache = [];
    function renderBotHistory(){
      const box = document.getElementById('botHistoryList');
      const cnt = document.getElementById('botHistCount');
      if (!box) return;
      const q = (document.getElementById('botHistSearch')||{}).value || '';
      const ql = q.toLowerCase();
      const rows = botHistoryCache.filter(h => !ql || String(h.title||'').toLowerCase().includes(ql));
      if (cnt) cnt.textContent = '(' + botHistoryCache.length + (q ? ' · tampil ' + rows.length : '') + ')';
      box.innerHTML = rows.map(h => {
        const t = String(h.posted_at||'').slice(0,16).replace('T',' ');
        return `<div class="flex items-start gap-2 border-b border-white/5 pb-1.5">
          <span class="text-[9px] text-slate-500 whitespace-nowrap mt-0.5">${botEsc(t)}</span>
          <div class="flex-1 min-w-0">
            <a href="${botEsc(h.post_url)}" target="_blank" class="text-slate-100 hover:text-emerald-300 block truncate">${botEsc(h.title)}</a>
            <span class="text-[9px] text-slate-500">${botEsc(h.source)}</span> ·
            <a href="${botEsc(h.url)}" target="_blank" class="text-[9px] text-slate-500 hover:text-slate-300">sumber asli</a>
          </div>
        </div>`;
      }).join('') || '<div class="text-[11px] text-slate-500">Belum ada postingan.</div>';
    }

    function renderBotSubpage(page){
      BOT_PAGES.forEach(p => {
        const el = document.getElementById('bot-sec-' + p.replace('bot-', ''));
        if (el) el.style.display = (p === page) ? 'flex' : 'none';

    function renderBotAutoBar(on){
