name: Apply header layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(header-layout):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply header layout CSS override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('panel-worker/ui-src/Styles.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* KD HEADER LAYOUT V5 */'
          if marker not in s:
              css = r'''
          /* KD HEADER LAYOUT V5 */
          /* Website aktif dipindahkan ke area kosong di tengah header.
             Logo website berada di sisi kanan teks dan dibuat sedikit lebih besar. */
          .session-header{
            grid-template-columns:150px minmax(360px,1fr) auto !important;
          }
          .session-sites-box{
            display:grid !important;
            grid-template-columns:minmax(0,1fr) auto !important;
            grid-template-rows:auto auto !important;
            align-items:center !important;
            column-gap:14px !important;
            row-gap:1px !important;
            padding:4px 8px !important;
          }
          .session-sites-title{
            grid-column:1 !important;
            grid-row:1 !important;
            margin:0 !important;
          }
          .session-sites{
            grid-column:1 !important;
            grid-row:2 !important;
            margin:1px 0 0 !important;
            max-width:none !important;
          }
          .session-logos{
            grid-column:2 !important;
            grid-row:1 / span 2 !important;
            align-self:center !important;
            margin:0 !important;
            height:42px !important;
            gap:9px !important;
          }
          .session-logo-item img,
          .session-logos img{
            width:46px !important;
            height:36px !important;
            padding:3px !important;
            border-radius:10px !important;
          }
          @media(max-width:1023px){
            .session-header{
              grid-template-columns:150px minmax(300px,1fr) auto !important;
            }
          }
          @media(max-width:760px){
            .session-header{
              grid-template-columns:minmax(145px,1fr) auto !important;
              gap:8px !important;
            }
            .session-header-main{
              border-right:0 !important;
              padding:3px 5px !important;
            }
            .session-sites-box{
              grid-column:1 !important;
              grid-row:1 !important;
              padding:3px 4px !important;
              border-top:0 !important;
              display:grid !important;
              grid-template-columns:minmax(0,1fr) auto !important;
              grid-template-rows:auto auto !important;
              column-gap:8px !important;
            }
            .session-sites-title{grid-column:1 !important;grid-row:1 !important;font-size:7px !important}
            .session-sites{grid-column:1 !important;grid-row:2 !important;font-size:8px !important}
            .session-logos{grid-column:2 !important;grid-row:1 / span 2 !important;height:36px !important;gap:5px !important}
            .session-logo-item img,
            .session-logos img{width:40px !important;height:32px !important}
            .session-header-actions{grid-column:2 !important;grid-row:1 !important}
          }
          '''
              s = s.rstrip() + '\n\n' + css + '\n'
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panel-worker/ui-src/Styles.html
          git commit -m 'chore(header-layout): move active website block and enlarge logos' || true
          git push
          git rm .github/workflows/apply-header-layout.yml
          git commit -m 'chore(header-layout): remove one-shot workflow'
          git push
