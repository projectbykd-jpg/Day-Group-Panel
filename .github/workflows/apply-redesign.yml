name: Apply UI Redesign

on:
  push:
    branches: [main]
    paths:
      - 'Redesign.html'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inject redesign CSS
        shell: python
        run: |
          from pathlib import Path
          styles = Path('Styles.html')
          redesign = Path('Redesign.html')
          base = styles.read_text(encoding='utf-8')
          addon = redesign.read_text(encoding='utf-8').strip()
          marker = '/* KD GROUP REDESIGN V1 */'
          if marker in base:
              start = base.index(marker)
              end = base.find('</style>', start)
              if end >= 0:
                  base = base[:start] + base[end:]
          css = addon
          if css.startswith('<style>') and css.endswith('</style>'):
              css = css[7:-8].strip()
          block = '\n\n' + marker + '\n' + css + '\n'
          pos = base.rfind('</style>')
          if pos < 0:
              raise SystemExit('Styles.html has no closing </style>')
          base = base[:pos] + block + base[pos:]
          styles.write_text(base, encoding='utf-8')

      - name: Commit generated Styles.html
        run: |
          git config user.name 'KD Group UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Styles.html
          git diff --cached --quiet || git commit -m 'build(ui): apply professional agent console redesign'
          git push
